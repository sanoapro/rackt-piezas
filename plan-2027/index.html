/* ==========================================================================
   Plan 2027 · RACK-T. Diseño fijo: el contenido vive en <script id="contenido">
   y lo escribe 09_ANALISIS/05_PLAN-2027/construir_presentacion.py.

:root{
  --rojo:#ab0505;--gris:#dfdfdf;--grafito:#323131;--marino:#002455;--naranja:#f8450d;--blanco:#fff;
  --gris-50:#f4f4f4;--gris-300:#bdbdbd;--grafito-700:#4a4848;
  --f-titulo:"League Gothic","Oswald","Arial Narrow",sans-serif;
  --f-cuerpo:"Bahnschrift","Barlow","Segoe UI",system-ui,sans-serif;
  /* modo claro */
  --bg:#f4f4f4;--card:#fff;--texto:#323131;--texto-2:#4a4848;--borde:#dfdfdf;--banda:#323131;--en-banda:#dfdfdf;
  --c-marino:#1f4f99;--c-rojo:#ab0505;--c-neutro:#7a7878;--c-total:#323131;
  --tinta-marino:#002455;--tinta-rojo:#ab0505;--suave-rojo:#fbeaea;--suave-marino:#e8eef8;
  --foco:#002455;--sombra:0 1px 0 rgba(50,49,49,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1b1b;--card:#262525;--texto:#e9e8e8;--texto-2:#bdbdbd;--borde:#3a3838;--banda:#111;--en-banda:#dfdfdf;
  --c-marino:#5585d1;--c-rojo:#dc4b42;--c-neutro:#8f8d8d;--c-total:#dfdfdf;
  --tinta-marino:#8fb3e8;--tinta-rojo:#f08a83;--suave-rojo:#3a2120;--suave-marino:#1e2a3d;--foco:#dfdfdf;--sombra:none}}
:root[data-theme="dark"]{
  --bg:#1c1b1b;--card:#262525;--texto:#e9e8e8;--texto-2:#bdbdbd;--borde:#3a3838;--banda:#111;--en-banda:#dfdfdf;
  --c-marino:#5585d1;--c-rojo:#dc4b42;--c-neutro:#8f8d8d;--c-total:#dfdfdf;
  --tinta-marino:#8fb3e8;--tinta-rojo:#f08a83;--suave-rojo:#3a2120;--suave-marino:#1e2a3d;--foco:#dfdfdf;--sombra:none}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--texto);font-family:var(--f-cuerpo);font-size:1rem;line-height:1.55}
h1,h2,h3{font-family:var(--f-titulo);font-weight:400;letter-spacing:.02em;line-height:1.02;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.envoltura{max-width:1180px;margin:0 auto;padding:0 20px}
@media (max-width:520px){.envoltura{padding:0 16px}}

/* --- Banda superior --- */
.banda{background:var(--banda);color:var(--en-banda)}
.banda .envoltura{display:flex;align-items:center;gap:20px;padding-top:18px;padding-bottom:18px}
.logo{display:block;height:34px;color:var(--en-banda);flex:none}
.logo svg{height:100%;width:auto;display:block}
.banda-titulo{flex:1;min-width:0;border-left:2px solid var(--rojo);padding-left:16px}
.banda-titulo h1{font-size:clamp(1.9rem,4.4vw,2.8rem);color:#fff}
.banda-titulo p{font-size:.92rem;color:var(--gris-300);margin-top:2px}
.botones{display:flex;gap:8px;flex:none}
.btn{font:600 .95rem var(--f-cuerpo);border-radius:4px;border:1px solid transparent;padding:10px 16px;cursor:pointer;min-height:44px}
.btn-presentar{background:var(--rojo);color:#fff}
.btn-presentar:hover{background:#8f0404}
.btn-tema{background:transparent;color:var(--en-banda);border-color:#5b5959;width:44px;padding:0;font-size:1.1rem}
@media (max-width:640px){.logo{height:26px}.banda .envoltura{flex-wrap:wrap;gap:12px}.banda-titulo{order:3;flex-basis:100%;border-left:0;padding-left:0}.botones{margin-left:auto}}

/* --- Pestañas --- */
.pestanas{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--borde)}
.pestanas .envoltura{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.pestanas .envoltura::-webkit-scrollbar{display:none}
.tab{flex:none;font:500 1rem var(--f-cuerpo);color:var(--texto-2);background:none;border:0;border-bottom:3px solid transparent;padding:14px 14px 11px;cursor:pointer;white-space:nowrap;min-height:48px}
.tab:hover{color:var(--texto)}
.tab[aria-selected="true"]{color:var(--texto);font-weight:700;border-bottom-color:var(--rojo)}
.tab .n{display:inline-block;min-width:1.4em;color:var(--texto-2);font-weight:400;margin-right:4px}

/* --- Panel --- */
main{padding:28px 0 64px}
.panel[hidden]{display:none}
.respuesta{font-family:var(--f-titulo);font-size:clamp(1.8rem,3.6vw,2.6rem);line-height:1.05;letter-spacing:.015em;max-width:38ch;border-left:6px solid var(--rojo);padding-left:18px;margin:4px 0 28px}
.bloque{margin-top:28px}
.bloque>h2{font-family:var(--f-cuerpo);font-weight:700;font-size:1.1rem;letter-spacing:0;margin-bottom:12px;color:var(--texto)}
.nota{font-size:.92rem;color:var(--texto-2);margin-top:10px;max-width:75ch}

/* --- La barra de $100 M (el elemento de marca: vigas de rack) --- */
.viga{margin:0 0 8px}
.viga-pista{display:flex;gap:3px;height:34px}
.viga-seg{border-radius:999px;height:100%;position:relative}
.viga-seg.medido{background:var(--c-marino)}
.viga-seg.hueco{background:repeating-linear-gradient(135deg,var(--c-rojo) 0 10px,color-mix(in srgb,var(--c-rojo) 72%,var(--card)) 10px 16px)}
.viga-rotulos{display:flex;gap:3px;margin-top:8px;font-size:.95rem}
.viga-rotulos div{min-width:0}
.viga-rotulos b{display:block;font-family:var(--f-titulo);font-weight:400;font-size:1.9rem;line-height:1;letter-spacing:.02em}
.viga-texto{margin:6px 0 4px;color:var(--texto-2);max-width:70ch}

/* --- Cifras --- */
.cifras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.cifras{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cifra{background:var(--card);border:1px solid var(--borde);border-radius:4px;padding:16px 18px;border-top:4px solid var(--c-total);box-shadow:var(--sombra)}
.cifra.marino{border-top-color:var(--c-marino)}.cifra.rojo{border-top-color:var(--c-rojo)}
.cifra .v{font-family:var(--f-titulo);font-size:clamp(2.4rem,5vw,3.4rem);line-height:1;letter-spacing:.01em}
.cifra.rojo .v{color:var(--tinta-rojo)}.cifra.marino .v{color:var(--tinta-marino)}
.cifra .e{font-weight:600;margin-top:6px}
.cifra .s{font-size:.88rem;color:var(--texto-2)}

/* --- Tarjetas --- */
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.tarjeta{background:var(--card);border:1px solid var(--borde);border-radius:4px;padding:18px 20px 20px;position:relative;box-shadow:var(--sombra)}
.tarjeta::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:4px;border-radius:4px 4px 0 0;background:var(--c-total)}
.tarjeta.marino::before{background:var(--c-marino)}.tarjeta.rojo::before{background:var(--c-rojo)}
.tarjeta h3{font-family:var(--f-cuerpo);font-weight:700;font-size:1.15rem;letter-spacing:0;line-height:1.25;margin-bottom:10px}
.insignia{display:inline-block;font-size:.82rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--suave-rojo);color:var(--tinta-rojo);margin-bottom:10px}
.insignia.marino{background:var(--suave-marino);color:var(--tinta-marino)}
ul.vinetas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.vinetas li{position:relative;padding-left:22px}
ul.vinetas li::before{content:"";position:absolute;left:0;top:.62em;width:12px;height:4px;border-radius:999px;background:var(--c-total)}
.tarjeta.marino ul.vinetas li::before{background:var(--c-marino)}.tarjeta.rojo ul.vinetas li::before{background:var(--c-rojo)}

/* --- Decisiones --- */
.decisiones{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.decision{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--borde);border-radius:4px;padding:12px 14px}
.decision i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--c-marino);color:#fff;display:grid;place-items:center;font-style:normal;font-size:.85rem;font-weight:700;margin-top:1px}

/* --- Gráficas comunes --- */
.grafica{background:var(--card);border:1px solid var(--borde);border-radius:4px;padding:18px 20px}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;color:var(--texto-2);margin-bottom:12px}
.leyenda span{display:inline-flex;align-items:center;gap:8px}
.muestra{width:18px;height:8px;border-radius:999px;display:inline-block}
.m-medido,.m-marino{background:var(--c-marino)}
.m-supuesto{background:repeating-linear-gradient(135deg,var(--c-marino) 0 4px,color-mix(in srgb,var(--c-marino) 35%,var(--card)) 4px 7px)}
.m-hueco,.m-rojo{background:var(--c-rojo)}
.m-resta,.m-grafito{background:var(--c-neutro)}
.m-total,.m-resultado{background:var(--c-total)}
details.tabla{margin-top:12px;font-size:.92rem}
details.tabla summary{cursor:pointer;color:var(--tinta-marino);font-weight:600;min-height:32px;display:flex;align-items:center}
details.tabla table{border-collapse:collapse;width:100%;margin-top:8px;font-variant-numeric:tabular-nums}
details.tabla th,details.tabla td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--borde)}
details.tabla td.num,details.tabla th.num{text-align:right}
.tabla-scroll{overflow-x:auto}

/* --- Cascada horizontal --- */
.cascada{display:grid;gap:6px}
.cfila{display:grid;grid-template-columns:minmax(150px,34%) 1fr;gap:14px;align-items:center;min-height:34px}
.cfila .cn{font-size:.95rem;line-height:1.25}
.cfila.total .cn,.cfila.resultado .cn{font-weight:700}
.cpista{position:relative;height:22px}
.cbarra{position:absolute;top:0;height:100%;border-radius:4px;min-width:3px;cursor:default}
.cbarra.medido{background:var(--c-marino)}
.cbarra.supuesto{background:repeating-linear-gradient(135deg,var(--c-marino) 0 6px,color-mix(in srgb,var(--c-marino) 35%,var(--card)) 6px 10px)}
.cbarra.hueco{background:var(--c-rojo)}
.cbarra.resta{background:var(--c-neutro)}
.cbarra.total{background:var(--c-total)}
.cbarra.resultado{background:var(--c-marino)}
.cvalor{position:absolute;top:50%;transform:translateY(-50%);font-size:.88rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:560px){.cfila{grid-template-columns:1fr;gap:4px}.cfila .cn{font-size:.9rem}}

/* --- Barras simples --- */
.barras{display:grid;gap:10px}
.bfila .bn{font-size:.95rem;margin-bottom:4px;display:flex;justify-content:space-between;gap:12px}
.bfila .bn b{font-variant-numeric:tabular-nums}
.bpista{height:14px;background:color-mix(in srgb,var(--borde) 60%,transparent);border-radius:999px;overflow:hidden}
.bbarra{height:100%;border-radius:999px}
.bbarra.marino{background:var(--c-marino)}.bbarra.rojo{background:var(--c-rojo)}.bbarra.grafito{background:var(--c-neutro)}

/* --- Líneas --- */
.lineas svg{width:100%;height:auto;display:block;overflow:visible}
.lineas .eje text{fill:var(--texto-2);font:12px var(--f-cuerpo)}
.lineas .reja{stroke:var(--borde);stroke-width:1}
.lineas .cero{stroke:var(--texto-2);stroke-width:1.2}
.lineas .serie{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.lineas .s-grafito{stroke:var(--c-neutro);stroke-dasharray:6 5}
.lineas .s-rojo{stroke:var(--c-rojo)}.lineas .s-marino{stroke:var(--c-marino)}
.lineas .punto{stroke:var(--card);stroke-width:2}
.lineas .p-grafito{fill:var(--c-neutro)}.lineas .p-rojo{fill:var(--c-rojo)}.lineas .p-marino{fill:var(--c-marino)}
.lineas .rotulo{font:600 12.5px var(--f-cuerpo);fill:var(--texto)}
.lineas svg.chico .eje text,.lineas svg.chico .rotulo{font-size:15px}
.lineas .guia{stroke:var(--texto-2);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.lineas .guia.on{opacity:1}

/* --- Línea de tiempo del equipo --- */
.gantt{overflow-x:auto}
.gantt-tabla{min-width:640px;display:grid;grid-template-columns:200px repeat(14,minmax(28px,1fr));row-gap:8px;align-items:center;font-size:.9rem}
.gantt-anio{font-weight:700;color:var(--texto-2);border-bottom:2px solid var(--borde);padding-bottom:2px}
.gantt-mes{color:var(--texto-2);font-size:.8rem;text-align:center}
.gantt-nombre b{display:block;font-size:.95rem}
.gantt-nombre span{color:var(--texto-2);font-size:.84rem}
.gantt-barra{height:16px;border-radius:999px}
.gantt-barra.marino{background:var(--c-marino)}.gantt-barra.grafito{background:var(--c-total)}
.gantt-barra.gris{background:transparent;border:2px dashed var(--c-neutro);height:16px}

/* --- Escenarios y reglas --- */
.escenarios,.reglas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.escenario,.regla{background:var(--card);border:1px solid var(--borde);border-radius:4px;padding:16px 18px}
.escenario.destacado{border:2px solid var(--c-marino)}
.escenario h3,.regla h3{font-family:var(--f-cuerpo);font-weight:700;font-size:1.05rem;letter-spacing:0}
.escenario .v{font-family:var(--f-titulo);font-size:2.3rem;line-height:1;margin-top:8px}
.escenario .d{color:var(--texto-2);font-size:.9rem}
.regla{position:relative}
.regla-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-height:44px;margin-bottom:6px}
.escenario .regla-cab{min-height:0;margin-bottom:2px;align-items:center}
.regla-cab .insignia{margin:4px 0 0}
.regla .letra{font-family:var(--f-titulo);font-size:2.6rem;line-height:.9;color:var(--texto-2)}
.regla.rojo .letra{color:var(--tinta-rojo)}.regla.marino .letra{color:var(--tinta-marino)}
.regla.recomendada{border:2px solid var(--c-marino)}
.regla dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:10px 0;font-size:.92rem}
.regla dt{color:var(--texto-2)}.regla dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.regla .peor.neg{color:var(--tinta-rojo)}

/* --- Pasos --- */
.pasos{display:grid;gap:8px}
.paso{display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--borde);border-radius:4px;padding:12px 16px}
.quien{font-weight:700}
.cuando{font-weight:600;font-size:.9rem;padding:4px 10px;border-radius:999px;background:var(--suave-marino);color:var(--tinta-marino);white-space:nowrap}
.cuando.pend{background:transparent;border:1px dashed var(--c-neutro);color:var(--texto-2)}
@media (max-width:560px){.paso{grid-template-columns:1fr auto;row-gap:2px}.paso .quien{grid-column:1/-1;font-size:.9rem;color:var(--texto-2)}}

/* --- Pendiente (lo que llega después) --- */
.pendiente{border:2px dashed var(--c-neutro);border-radius:4px;padding:16px 18px;display:flex;gap:16px;align-items:flex-start;background:var(--card)}
.pendiente .barras-marca{flex:none;width:28px;height:38px;background:repeating-linear-gradient(to bottom,var(--c-neutro) 0 5px,transparent 5px 11px);border-radius:2px;opacity:.6}
.pendiente h3{font-family:var(--f-cuerpo);font-weight:700;font-size:1.05rem;letter-spacing:0}
.pendiente .quien-llega{font-size:.88rem;color:var(--texto-2);margin-top:4px}

/* --- Sugerencia (lo decide Juan Carlos) --- */
.sugerencia{border:1px solid var(--c-marino);border-left:6px solid var(--c-marino);border-radius:4px;padding:16px 18px;background:var(--suave-marino)}
.sugerencia .sug-et{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-marino);margin-bottom:6px}
.sugerencia h3{font-family:var(--f-cuerpo);font-weight:700;font-size:1.08rem;letter-spacing:0;margin:0 0 8px}
.sugerencia .sug-por{font-weight:600;font-size:.92rem;margin:8px 0 4px}
.sugerencia ul{margin:0;padding-left:1.2em}.sugerencia li{margin:3px 0}
.sugerencia .sug-nota{font-size:.88rem;color:var(--texto-2);margin-top:10px}

/* --- Tooltip --- */
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--grafito);color:#fff;font-size:.88rem;line-height:1.35;padding:8px 10px;border-radius:4px;max-width:260px;opacity:0;transition:opacity .12s}
#tip.ver{opacity:1}
#tip b{display:block}

/* --- Pie --- */
footer{border-top:1px solid var(--borde);padding:18px 0 28px;color:var(--texto-2);font-size:.9rem}
footer .envoltura{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.flechas{display:none}

/* --- Modo presentar --- */
body.presentando .banda .botones .btn-tema{display:none}
body.presentando main{padding-top:36px}
body.presentando .respuesta{font-size:clamp(2.4rem,4.6vw,3.6rem)}
