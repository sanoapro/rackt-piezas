<!-- Tema y movimiento: se deciden ANTES de pintar para que no parpadee -->
<script>
  (function () {
    var tema = null;
    try { tema = localStorage.getItem('rt-tema'); } catch (e) {}
    if (tema !== 'light' && tema !== 'dark') {
      tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', tema);
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('animar');
    }
  })();
</script>

<style>
/* ==========================================================================
   MODELO UNA HOJA — RACK-T
   Diseño fijo. El contenido vive en <script id="contenido"> al final.
   Guía: COMO-USAR.md (misma carpeta).

/* ==========================================================================
   1. TOKENS DE MARCA — el único bloque que se edita para cambiar la marca
   Fuente: Brand Book RACK-T 2025 (01_INSTITUCIONAL/01_Brand-book-2025.pdf)
   ========================================================================== */
:root {
  /* Colores de marca */
  --color-primario: #ab0505;          /* Rojo RACK-T · CTA, énfasis, logotipo */
  --color-secundario: #323131;        /* Grafito · texto y bloques oscuros */
  --color-neutro: #dfdfdf;            /* Gris · superficies y texto sobre oscuro */
  --color-acento: #002455;            /* Azul marino · información y foco */
  --color-destacado: #f8450d;         /* Naranja · SOLO acentos gráficos, nunca texto */
  --color-exito: #1d6b47;
  --color-alerta: #9a5c00;
  --color-blanco: #ffffff;

  /* Tintes derivados (no son colores nuevos de marca) */
  --color-neutro-claro: #f4f4f4;
  --color-neutro-medio: #bdbdbd;
  --color-secundario-medio: #4a4848;
  --color-secundario-profundo: #242323;
  --color-secundario-noche: #1a1919;

  /* Variantes para modo oscuro (texto legible sobre grafito) */
  --color-acento-oscuro: #8fb3e8;
  --color-exito-oscuro: #62c795;
  --color-alerta-oscuro: #f0aa4a;

  /* Tipografía: League Gothic solo tiene peso Regular (no se pone en bold) */
  --fuente-titulos: "League Gothic", "Oswald", "Arial Narrow", Impact, sans-serif;
  --fuente-cuerpo: "Bahnschrift", "Barlow", "Segoe UI", system-ui, sans-serif;
  --tracking-titulos: 0.03em;
  --tracking-etiquetas: 0.14em;

  /* Escala tipográfica */
  --texto-xs: 0.8rem;
  --texto-sm: 0.9rem;
  --texto-base: 1.0625rem;
  --texto-lg: 1.25rem;
  --texto-xl: 1.563rem;
  --texto-2xl: 2rem;
  --texto-3xl: clamp(2.2rem, 4.5vw, 3.2rem);
  --texto-4xl: clamp(2.6rem, 6vw, 4.6rem);
  --texto-hero: clamp(3.1rem, 8.4vw, 7rem);

  /* Espaciado (múltiplos de 4) */
  --espacio-1: 4px;  --espacio-2: 8px;   --espacio-3: 12px; --espacio-4: 16px;
  --espacio-6: 24px; --espacio-8: 32px;  --espacio-12: 48px; --espacio-16: 64px;
  --espacio-24: 96px;
  --espacio-seccion: clamp(64px, 10vw, 128px);
  --ancho-max: 1200px;
  --margen-lateral: clamp(16px, 5vw, 48px);
  --alto-encabezado: 72px;

  /* Forma: la marca es estructural (postes de rack). Radios pequeños. */
  --radio-sm: 2px;
  --radio: 4px;
  --radio-barra: 999px;
  --sombra: 0 1px 2px rgb(0 0 0 / .06), 0 6px 18px rgb(0 0 0 / .06);
  --sombra-alta: 0 2px 4px rgb(0 0 0 / .08), 0 18px 40px rgb(0 0 0 / .16);

  /* Movimiento */
  --duracion-corta: 200ms;
  --duracion-media: 400ms;
  --duracion-larga: 650ms;
  --curva: cubic-bezier(.2, .7, .2, 1);
  --escalon: 80ms;
}

/* ==========================================================================
   2. ROLES DE COLOR — claro y oscuro (leen los tokens de arriba)
   Los componentes solo usan estos roles, nunca un hex.
   ========================================================================== */
:root {
  --color-fondo: var(--color-blanco);
  --color-superficie: var(--color-neutro-claro);
  --color-superficie-fuerte: var(--color-neutro);
  --color-texto: var(--color-secundario);
  --color-texto-suave: var(--color-secundario-medio);
  --color-borde: var(--color-neutro);
  --color-marca-texto: var(--color-primario);
  --color-barra: var(--color-primario);
  --color-info: var(--color-acento);
  --color-foco: var(--color-acento);
  --color-oscuro: var(--color-secundario);
  --color-oscuro-2: var(--color-secundario-profundo);
  --color-sobre-oscuro: var(--color-neutro);
  --color-sobre-oscuro-suave: var(--color-neutro-medio);
  --color-sobre-primario: var(--color-blanco);
  --color-exito-texto: var(--color-exito);
  --color-alerta-texto: var(--color-alerta);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --color-fondo: var(--color-secundario-profundo);
  --color-superficie: var(--color-secundario);
  --color-superficie-fuerte: var(--color-secundario-medio);
  --color-texto: var(--color-neutro);
  --color-texto-suave: var(--color-neutro-medio);
  --color-borde: var(--color-secundario-medio);
  --color-marca-texto: var(--color-neutro-medio);   /* en oscuro el rojo no se usa como texto */
  --color-info: var(--color-acento-oscuro);
  --color-foco: var(--color-neutro);
  --color-oscuro: var(--color-secundario-noche);
  --color-oscuro-2: var(--color-secundario-noche);
  --color-exito-texto: var(--color-exito-oscuro);
  --color-alerta-texto: var(--color-alerta-oscuro);
  color-scheme: dark;
}

/* Bloques con fondo propio: reasignan los roles para que los componentes se adapten */
.bloque-oscuro {
  --color-texto: var(--color-sobre-oscuro);
  --color-texto-suave: var(--color-sobre-oscuro-suave);
  --color-borde: rgb(255 255 255 / .14);
  --color-foco: var(--color-neutro);
  --color-marca-texto: var(--color-sobre-oscuro-suave);
  background: var(--color-oscuro);
  color: var(--color-texto);
}
.bloque-primario {
  --color-texto: var(--color-sobre-primario);
  --color-texto-suave: rgb(255 255 255 / .88);
  --color-borde: rgb(255 255 255 / .28);
  --color-foco: var(--color-blanco);
  --color-marca-texto: var(--color-sobre-primario);
  --color-barra: var(--color-sobre-primario);
  background: var(--color-primario);
  color: var(--color-texto);
}

/* ==========================================================================
   3. BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--alto-encabezado) + 16px);
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--color-fondo);
  color: var(--color-texto);
  font-family: var(--fuente-cuerpo);
  font-size: var(--texto-base);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .titulo {
  font-family: var(--fuente-titulos);
  font-weight: 400;
  letter-spacing: var(--tracking-titulos);
  line-height: 1;
  text-transform: uppercase;
  margin: 0;
  text-wrap: balance;
}
p { margin: 0; text-wrap: pretty; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--color-foco); outline-offset: 3px; border-radius: var(--radio-sm); }

.contenedor {
  width: min(100% - 2 * var(--margen-lateral), var(--ancho-max));
  margin-inline: auto;
}
.solo-lectores {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.saltar {
  position: fixed; top: 8px; left: 8px; z-index: 100;
  padding: 10px 16px; background: var(--color-primario); color: var(--color-sobre-primario);
  font-weight: 600; text-decoration: none; border-radius: var(--radio);
  transform: translateY(-160%); transition: transform var(--duracion-corta) var(--curva);
}
.saltar:focus { transform: none; }

/* ==========================================================================
   4. COMPONENTES
   ========================================================================== */

/* --- 4.1 Botones y enlaces --- */
.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 12px 22px;
  font-family: var(--fuente-cuerpo); font-weight: 600; font-size: var(--texto-sm);
  letter-spacing: .08em; text-transform: uppercase; text-decoration: none;
  border: 2px solid transparent; border-radius: var(--radio-sm); cursor: pointer;
  transition: transform var(--duracion-corta) var(--curva), box-shadow var(--duracion-corta) var(--curva),
              background-color var(--duracion-corta) var(--curva), color var(--duracion-corta) var(--curva);
}
.boton svg { width: 18px; height: 18px; transition: transform var(--duracion-corta) var(--curva); }
.boton:hover { transform: translateY(-2px); box-shadow: var(--sombra-alta); }
.boton:hover svg { transform: translateX(4px); }
.boton:active { transform: translateY(0); box-shadow: none; }
.boton--primario { background: var(--color-primario); color: var(--color-sobre-primario); }
.boton--secundario { background: transparent; color: var(--color-texto); border-color: currentColor; }
.boton--secundario:hover { background: var(--color-texto); color: var(--color-fondo); }
.bloque-oscuro .boton--secundario:hover { color: var(--color-oscuro); }
.bloque-primario .boton--primario { background: var(--color-blanco); color: var(--color-primario); }
.bloque-primario .boton--secundario:hover { color: var(--color-primario); }
.boton--chico { min-height: 40px; padding: 8px 16px; font-size: var(--texto-xs); }

/* Subrayado animado (enlaces de texto y menú) */
.enlace {
  text-decoration: none;
  background: linear-gradient(var(--color-barra), var(--color-barra)) left bottom / 0 2px no-repeat;
  transition: background-size var(--duracion-media) var(--curva);
  padding-bottom: 2px;
}
.enlace:hover, .enlace:focus-visible, .enlace[aria-current="true"] { background-size: 100% 2px; }

/* Etiqueta de sección: barra roja + número + texto */
.etiqueta {
  display: inline-flex; align-items: center; gap: 12px;
  font-size: var(--texto-xs); font-weight: 600; line-height: 1.2;
  letter-spacing: var(--tracking-etiquetas); text-transform: uppercase;
  color: var(--color-marca-texto);
}
.etiqueta::before {
  content: ""; flex: none; width: 28px; height: 6px;
  border-radius: var(--radio-barra); background: var(--color-barra);
}
.etiqueta .numero { font-family: var(--fuente-titulos); font-size: 1.2rem; letter-spacing: .04em; font-weight: 400; }

/* --- 4.2 Encabezado fijo --- */
.encabezado {
  position: fixed; inset: 0 0 auto 0; z-index: 50;
  height: var(--alto-encabezado);
  color: var(--color-sobre-oscuro);
  --color-foco: var(--color-neutro);
  --color-barra: var(--color-primario);
  transition: background-color var(--duracion-media) var(--curva), box-shadow var(--duracion-media) var(--curva);
}
.encabezado.solido { background: var(--color-oscuro); box-shadow: 0 1px 0 rgb(255 255 255 / .06), 0 8px 24px rgb(0 0 0 / .18); }
.encabezado .contenedor { height: 100%; display: flex; align-items: center; gap: var(--espacio-6); }
.encabezado .logo { color: var(--color-sobre-oscuro); flex: none; display: block; }
.encabezado .logo svg { height: 34px; width: auto; }
.menu { margin-left: auto; }
.menu ul { list-style: none; margin: 0; padding: 0; display: flex; gap: var(--espacio-6); }
.menu a { font-size: var(--texto-sm); font-weight: 500; letter-spacing: .04em; }
.acciones-encabezado { display: flex; align-items: center; gap: var(--espacio-3); }
.boton-icono {
  display: inline-grid; place-items: center; width: 40px; height: 40px;
  background: transparent; border: 1px solid rgb(255 255 255 / .22); border-radius: var(--radio-sm);
  color: var(--color-sobre-oscuro); cursor: pointer;
  transition: background-color var(--duracion-corta) var(--curva), border-color var(--duracion-corta) var(--curva);
}
.boton-icono:hover { background: rgb(255 255 255 / .08); border-color: rgb(255 255 255 / .45); }
.boton-icono svg { width: 20px; height: 20px; }
.menu-boton { display: none; }
[data-theme="dark"] .icono-luna, [data-theme="light"] .icono-sol { display: none; }

@media (max-width: 959px) {
  .menu-boton { display: inline-grid; }
  .menu {
    position: absolute; top: var(--alto-encabezado); left: 0; right: 0;
    background: var(--color-oscuro); border-top: 1px solid rgb(255 255 255 / .08);
    padding: var(--espacio-4) var(--margen-lateral) var(--espacio-6);
    display: none;
  }
  .encabezado.abierto { background: var(--color-oscuro); }
  .encabezado.abierto .menu { display: block; }
  .menu ul { flex-direction: column; gap: 0; }
  .menu a { display: block; padding: 14px 0; font-size: var(--texto-lg); border-bottom: 1px solid rgb(255 255 255 / .08); background: none; }
  .acciones-encabezado { margin-left: auto; }
}
@media (max-width: 479px) {
  .acciones-encabezado .boton { display: none; }
  .encabezado .logo svg { height: 28px; }
}

/* --- 4.3 Progreso de lectura: poste de rack que se llena de rojo --- */
.riel {
  position: fixed; z-index: 40; pointer-events: none;
  left: 20px; top: calc(var(--alto-encabezado) + 32px); bottom: 32px; width: 10px;
  background: var(--color-borde);
  /* perforaciones del poste */
  -webkit-mask: repeating-linear-gradient(to bottom, #000 0 10px, transparent 10px 15px);
          mask: repeating-linear-gradient(to bottom, #000 0 10px, transparent 10px 15px);
}
.riel span {
  position: absolute; inset: 0; background: var(--color-primario);
  transform-origin: top; transform: scaleY(var(--progreso, 0));
}
@media (max-width: 1319px) {
  .riel {
    left: 0; right: 0; bottom: auto; top: var(--alto-encabezado); width: auto; height: 4px;
    -webkit-mask: repeating-linear-gradient(to right, #000 0 22px, transparent 22px 26px);
            mask: repeating-linear-gradient(to right, #000 0 22px, transparent 22px 26px);
    background: transparent;
  }
  .riel span { transform-origin: left; transform: scaleX(var(--progreso, 0)); }
}

/* --- 4.4 Secciones --- */
.seccion { padding-block: var(--espacio-seccion); position: relative; }
.seccion--superficie { background: var(--color-superficie); }
.cabeza { display: grid; gap: var(--espacio-4); max-width: 780px; margin-bottom: var(--espacio-12); }
.cabeza h2 { font-size: var(--texto-4xl); }
.cabeza .intro { font-size: var(--texto-lg); color: var(--color-texto-suave); max-width: 62ch; }
.cabeza--centro { margin-inline: auto; text-align: center; justify-items: center; }

/* --- 4.5 Hero --- */
.hero {
  position: relative; overflow: hidden; isolation: isolate;
  min-height: min(100svh, 900px);
  display: flex; align-items: center;
  padding-block: calc(var(--alto-encabezado) + var(--espacio-12)) var(--espacio-16);
}
.hero::before {                         /* patrón de barras de la marca, deriva muy lenta */
  content: ""; position: absolute; inset: -40px 0 -40px 52%; z-index: -1;
  background-image: repeating-linear-gradient(to bottom, var(--color-primario) 0 14px, transparent 14px 34px);
  opacity: .10;
  -webkit-mask: linear-gradient(to right, transparent, #000 40%);
          mask: linear-gradient(to right, transparent, #000 40%);
}
.animar .hero::before { animation: deriva 24s linear infinite; }
@keyframes deriva { to { transform: translateY(34px); } }
.hero .contenedor { display: grid; gap: var(--espacio-12); align-items: center; }
@media (min-width: 900px) { .hero .contenedor { grid-template-columns: 1.15fr .85fr; } }
.hero h1 { font-size: var(--texto-hero); line-height: .94; margin-block: var(--espacio-6); }
.resaltado {
  background: var(--color-primario); color: var(--color-sobre-primario);
  padding: 0 .12em; box-decoration-break: clone; -webkit-box-decoration-break: clone;
}
.hero .subtitulo { font-size: clamp(1.1rem, 1.6vw, 1.3rem); color: var(--color-texto-suave); max-width: 56ch; }
.botones { display: flex; flex-wrap: wrap; gap: var(--espacio-4); margin-top: var(--espacio-8); }
.hero-visual { position: relative; }
.hero-visual .foto { aspect-ratio: 4 / 5; }

/* Ilustración de rack (se usa mientras no haya foto) */
.ilustracion { width: 100%; height: auto; max-width: 520px; margin-inline: auto; }
.ilus-poste { fill: var(--color-sobre-oscuro-suave); }
.ilus-perfo { fill: var(--color-oscuro); }
.ilus-viga { fill: var(--color-primario); }
.ilus-tarima { fill: var(--color-secundario-medio); }
.ilus-carga { fill: rgb(255 255 255 / .06); stroke: var(--color-sobre-oscuro-suave); stroke-width: 1.5; }
.ilus-carga--acento { fill: var(--color-destacado); stroke: none; }
.ilus-piso { stroke: var(--color-sobre-oscuro-suave); stroke-width: 2; }
.ilus-cota { stroke: var(--color-acento-oscuro); stroke-width: 1.5; fill: none; }
.animar .ilustracion .ilus-viga { transform-box: fill-box; transform-origin: left; transform: scaleX(0); }
.animar .ilustracion .ilus-bulto { opacity: 0; transform: translateY(-12px); }
.animar .ilustracion.visible .ilus-viga {
  transform: scaleX(1);
  transition: transform var(--duracion-larga) var(--curva) calc(var(--i, 0) * 90ms);
}
.animar .ilustracion.visible .ilus-bulto {
  opacity: 1; transform: none;
  transition: opacity var(--duracion-media) var(--curva) calc(400ms + var(--i, 0) * 60ms),
              transform var(--duracion-media) var(--curva) calc(400ms + var(--i, 0) * 60ms);
}

/* Foto: blanco y negro con acento rojo (dirección del brand book) */
.foto { position: relative; margin: 0; overflow: hidden; border-radius: var(--radio); background: var(--color-superficie-fuerte); }
.foto img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
.foto--color img { filter: none; }
.foto::after { content: ""; position: absolute; left: 0; bottom: 0; width: 38%; height: 8px; background: var(--color-primario); }

/* --- 4.6 Cifras clave --- */
.cifras { display: grid; gap: var(--espacio-8); grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.cifra { display: grid; gap: var(--espacio-2); align-content: start; }
.cifra::before { content: ""; width: 56px; height: 8px; border-radius: var(--radio-barra); background: var(--color-barra); margin-bottom: var(--espacio-3); }
.cifra-valor {
  font-family: var(--fuente-titulos); font-size: clamp(3.2rem, 6vw, 5rem); line-height: .95;
  letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.cifra-afijo { font-size: .5em; letter-spacing: .04em; }
.cifra-etiqueta { font-weight: 600; font-size: var(--texto-base); }
.cifra-nota { font-size: var(--texto-sm); color: var(--color-texto-suave); }

/* --- 4.7 Tarjetas de beneficios --- */
.rejilla { display: grid; gap: var(--espacio-6); grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); }
.tarjeta {
  position: relative; display: grid; gap: var(--espacio-4); align-content: start;
  padding: var(--espacio-8) var(--espacio-6) var(--espacio-8);
  background: var(--color-fondo); border: 1px solid var(--color-borde); border-radius: var(--radio);
  transition: transform var(--duracion-media) var(--curva), box-shadow var(--duracion-media) var(--curva), border-color var(--duracion-media) var(--curva);
}
.seccion--superficie .tarjeta { background: var(--color-fondo); }
.tarjeta::after {
  content: ""; position: absolute; left: -1px; right: -1px; bottom: -1px; height: 4px;
  background: var(--color-primario); transform: scaleX(0); transform-origin: left;
  transition: transform var(--duracion-media) var(--curva);
}
.tarjeta:hover, .tarjeta:focus-within { transform: translateY(-4px); box-shadow: var(--sombra-alta); border-color: transparent; }
.tarjeta:hover::after, .tarjeta:focus-within::after { transform: scaleX(1); }
.icono-caja {
  display: grid; place-items: center; width: 52px; height: 52px;
  background: var(--color-oscuro); color: var(--color-sobre-oscuro); border-radius: var(--radio-sm);
}
.icono-caja svg { width: 26px; height: 26px; }
.tarjeta h3 { font-size: var(--texto-2xl); }
.tarjeta p { color: var(--color-texto-suave); }

/* Tarjeta con foto: la foto va a sangre arriba y el ícono se monta en su borde.
   En reposo la foto está en blanco y negro (brand book); al pasar el cursor recupera el color. */
.tarjeta--foto { padding-top: 0; overflow: hidden; }
.tarjeta--foto .tarjeta-foto { margin: 0 calc(-1 * var(--espacio-6)); aspect-ratio: 16 / 10; border-radius: var(--radio) var(--radio) 0 0; }
.tarjeta--foto .tarjeta-foto::after { height: 6px; }
.tarjeta--foto .icono-caja { position: relative; z-index: 1; margin-top: calc(-26px - var(--espacio-4)); box-shadow: 0 0 0 4px var(--color-fondo); }
.foto img { transition: filter var(--duracion-larga) var(--curva), transform 700ms var(--curva); }
.tarjeta--foto:hover .foto img, .tarjeta--foto:focus-within .foto img { filter: none; transform: scale(1.04); }

/* --- 4.7b Galería de proyectos --- */
.galeria {
  display: grid; gap: var(--espacio-3);
  grid-template-columns: repeat(4, 1fr); grid-auto-rows: clamp(170px, 17vw, 230px);
}
.galeria-item { position: relative; margin: 0; overflow: hidden; border-radius: var(--radio); grid-column: span var(--c4, 1); }
.galeria-item--grande { grid-row: span 2; }
.galeria-item .foto { height: 100%; border-radius: 0; }
.galeria-item .foto::after { display: none; }                  /* el acento rojo va en la leyenda */
.galeria-item figcaption {
  position: absolute; inset: auto 0 0 0; padding: var(--espacio-12) var(--espacio-4) var(--espacio-4);
  display: grid; gap: 2px; color: var(--color-neutro);
  background: linear-gradient(to top, rgb(26 25 25 / .88), rgb(26 25 25 / 0));
}
.galeria-item figcaption strong {
  font-family: var(--fuente-titulos); font-weight: 400; font-size: 1.5rem; line-height: 1;
  letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 10px;
}
.galeria-item figcaption strong::before { content: ""; width: 18px; height: 6px; border-radius: var(--radio-barra); background: var(--color-primario); flex: none; }
.galeria-item--grande figcaption strong { font-size: 2.2rem; }
.galeria-item figcaption span { font-size: var(--texto-sm); color: var(--color-neutro-medio); }
.galeria-item:hover .foto img { filter: none; transform: scale(1.05); }
.galeria-nota { margin-top: var(--espacio-6); font-size: var(--texto-sm); color: var(--color-texto-suave); }
@media (max-width: 959px) {
  .galeria { grid-template-columns: repeat(2, 1fr); grid-auto-rows: clamp(150px, 30vw, 220px); }
  .galeria-item { grid-column: span var(--c2, 1); }
}
@media (max-width: 479px) {
  .galeria { grid-template-columns: 1fr; grid-auto-rows: 220px; }
  .galeria-item, .galeria-item--grande { grid-column: auto; grid-row: auto; }
}

/* --- 4.8 Cómo funciona: línea de tiempo --- */
.pasos { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--espacio-8); position: relative; }
.paso { position: relative; display: grid; gap: var(--espacio-3); padding-left: 72px; }
.paso-numero {
  position: absolute; left: 0; top: 0; width: 52px; height: 52px; display: grid; place-items: center;
  font-family: var(--fuente-titulos); font-size: 1.7rem; letter-spacing: .02em;
  background: var(--color-fondo); color: var(--color-texto); border: 2px solid var(--color-texto); border-radius: var(--radio-sm);
  transition: background-color var(--duracion-media) var(--curva), color var(--duracion-media) var(--curva), border-color var(--duracion-media) var(--curva);
}
.paso.visible .paso-numero, html:not(.animar) .paso-numero { background: var(--color-primario); border-color: var(--color-primario); color: var(--color-sobre-primario); }
.paso h3 { font-size: var(--texto-2xl); padding-top: 10px; }
.paso p { color: var(--color-texto-suave); }
.pasos::before {                       /* la viga que une los pasos */
  content: ""; position: absolute; left: 25px; top: 8px; bottom: 8px; width: 2px; background: var(--color-borde);
}
@media (min-width: 900px) {
  .pasos { grid-template-columns: repeat(var(--n, 4), 1fr); gap: var(--espacio-6); }
  .paso { padding-left: 0; padding-top: 76px; }
  .pasos::before { left: 26px; right: 26px; top: 25px; bottom: auto; width: auto; height: 2px; }
}

/* --- 4.9 Planes o paquetes --- */
.planes { display: grid; gap: var(--espacio-6); grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); align-items: stretch; }
.plan {
  position: relative; display: flex; flex-direction: column; gap: var(--espacio-4);
  padding: var(--espacio-8); background: var(--color-fondo);
  border: 1px solid var(--color-borde); border-top: 6px solid var(--color-borde); border-radius: var(--radio);
  transition: transform var(--duracion-media) var(--curva), box-shadow var(--duracion-media) var(--curva);
}
.plan:hover { transform: translateY(-4px); box-shadow: var(--sombra-alta); }
.plan--destacado { border-top-color: var(--color-primario); }
.plan--destacado.bloque-oscuro { background: var(--color-oscuro); border-color: var(--color-oscuro); border-top-color: var(--color-primario); }
@media (min-width: 900px) { .plan--destacado { transform: translateY(-12px); } .plan--destacado:hover { transform: translateY(-16px); } }
.insignia {
  position: absolute; top: -6px; right: var(--espacio-6); transform: translateY(-50%);
  padding: 6px 12px; background: var(--color-primario); color: var(--color-sobre-primario);
  font-size: var(--texto-xs); font-weight: 600; letter-spacing: var(--tracking-etiquetas); text-transform: uppercase;
  border-radius: var(--radio-sm);
}
.plan h3 { font-size: var(--texto-2xl); }
.plan-descripcion { color: var(--color-texto-suave); }
.plan-precio { font-family: var(--fuente-titulos); font-size: clamp(2rem, 3vw, 2.6rem); line-height: 1; letter-spacing: .02em; text-transform: uppercase; }
.plan-nota { font-size: var(--texto-sm); color: var(--color-texto-suave); }
.lista-check { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--espacio-3); }
.lista-check li { display: grid; grid-template-columns: 20px 1fr; gap: var(--espacio-3); align-items: start; }
.lista-check svg { width: 20px; height: 20px; margin-top: 3px; color: var(--color-marca-texto); }
.plan .boton { margin-top: auto; }
.plan-pie { margin-top: auto; padding-top: var(--espacio-4); display: grid; }

/* --- 4.10 Testimonios o casos --- */
.testimonios { display: grid; gap: var(--espacio-6); grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.testimonio {
  position: relative;
  display: flex; flex-direction: column; gap: var(--espacio-6); margin: 0;
  padding: var(--espacio-8); background: var(--color-superficie); border-left: 6px solid var(--color-primario); border-radius: var(--radio);
}
.testimonio::before { content: "“"; font-family: var(--fuente-titulos); font-size: 5rem; line-height: .6; color: var(--color-marca-texto); height: .4em; }
.testimonio blockquote { margin: 0; font-size: var(--texto-lg); line-height: 1.5; }
.testimonio figcaption { margin-top: auto; display: grid; gap: 2px; }
.testimonio figcaption strong { font-weight: 600; }
.testimonio figcaption span { font-size: var(--texto-sm); color: var(--color-texto-suave); }
.marca-ejemplo {
  position: absolute; top: var(--espacio-6); right: var(--espacio-6); padding: 3px 10px;
  font-size: var(--texto-xs); font-weight: 600; letter-spacing: var(--tracking-etiquetas); text-transform: uppercase;
  color: var(--color-info); border: 1px solid currentColor; border-radius: var(--radio-sm);
}

/* --- 4.10b Casos: logo del cliente y proyecto realizado --- */
.casos { display: grid; gap: var(--espacio-6); grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.caso {
  position: relative; display: flex; flex-direction: column; gap: var(--espacio-4);
  padding: var(--espacio-6); background: var(--color-fondo); border: 1px solid var(--color-borde);
  border-top: 6px solid var(--color-primario); border-radius: var(--radio);
  transition: transform var(--duracion-media) var(--curva), box-shadow var(--duracion-media) var(--curva);
}
.caso:hover { transform: translateY(-4px); box-shadow: var(--sombra-alta); }
/* El logo siempre sobre claro: muchos logos de cliente son oscuros y desaparecen en modo oscuro */
.caso-logo { height: 76px; display: grid; place-items: center; padding: var(--espacio-3); background: var(--color-blanco); border-radius: var(--radio-sm); border: 1px solid var(--color-neutro); }
.caso-logo img { max-height: 52px; max-width: 100%; width: auto; object-fit: contain; }
.caso-logo .aliado-nombre { font-size: 1.6rem; color: var(--color-secundario); }
.caso-sector { font-size: var(--texto-xs); font-weight: 600; letter-spacing: var(--tracking-etiquetas); text-transform: uppercase; color: var(--color-marca-texto); }
.caso h3 { font-size: var(--texto-2xl); margin-top: 2px; }
.caso-proyecto { color: var(--color-texto); }
.caso-proyecto strong { font-weight: 600; }
.caso-nota { font-size: var(--texto-sm); color: var(--color-texto-suave); }

/* --- 4.11 Aliados: franja con desplazamiento continuo --- */
.aliados { padding-block: var(--espacio-16); border-block: 1px solid var(--color-borde); }
.aliados .cabeza { margin-bottom: var(--espacio-8); }
.aliados .cabeza h2 { font-size: var(--texto-3xl); }
.marquesina {
  overflow: hidden;
  -webkit-mask: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
          mask: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
}
.pista { display: flex; width: max-content; }
.animar .pista { animation: desplazar var(--velocidad, 40s) linear infinite; }
.marquesina:hover .pista, .marquesina:focus-within .pista { animation-play-state: paused; }
@keyframes desplazar { to { transform: translateX(-50%); } }
.grupo-aliados { display: flex; align-items: center; list-style: none; margin: 0; padding: 0; }
.aliado { display: flex; align-items: center; gap: var(--espacio-12); padding-right: var(--espacio-12); }
.aliado::after { content: ""; width: 22px; height: 6px; border-radius: var(--radio-barra); background: var(--color-barra); }
.aliado-nombre { font-family: var(--fuente-titulos); font-size: clamp(1.8rem, 3vw, 2.4rem); letter-spacing: .05em; text-transform: uppercase; color: var(--color-texto-suave); white-space: nowrap; transition: color var(--duracion-corta) var(--curva); }
.aliado:hover .aliado-nombre { color: var(--color-texto); }
.aliado img { height: 44px; width: auto; max-width: 150px; object-fit: contain; filter: grayscale(1); opacity: .75; transition: filter var(--duracion-corta) var(--curva), opacity var(--duracion-corta) var(--curva); }
/* En modo oscuro los logos de cliente (casi todos oscuros) van sobre una placa clara */
[data-theme="dark"] .aliado img { background: var(--color-neutro-claro); padding: 8px 12px; border-radius: var(--radio-sm); box-sizing: content-box; opacity: .9; }
.aliado:hover img { filter: none; opacity: 1; }

/* --- 4.12 Preguntas frecuentes: acordeón accesible --- */
.faq { max-width: 860px; margin-inline: auto; border-top: 2px solid var(--color-texto); }
.faq-item { border-bottom: 1px solid var(--color-borde); }
.faq-item h3 { font-family: var(--fuente-cuerpo); text-transform: none; letter-spacing: 0; line-height: 1.35; }
.faq-boton {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: var(--espacio-6);
  padding: var(--espacio-6) 0; background: none; border: 0; text-align: left; cursor: pointer;
  font-size: var(--texto-lg); font-weight: 600;
}
.faq-boton:hover { color: var(--color-marca-texto); }
.faq-signo { position: relative; flex: none; width: 28px; height: 28px; border: 2px solid currentColor; border-radius: var(--radio-sm); transition: transform var(--duracion-media) var(--curva), background-color var(--duracion-corta); }
.faq-signo::before, .faq-signo::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 2px; background: currentColor; transform: translate(-50%, -50%); }
.faq-signo::after { transform: translate(-50%, -50%) rotate(90deg); }
.faq-boton[aria-expanded="true"] .faq-signo { transform: rotate(45deg); }
.faq-panel { padding: 0 0 var(--espacio-6); color: var(--color-texto-suave); max-width: 70ch; }
.faq-panel p + p { margin-top: var(--espacio-3); }
.animar .faq-panel:not([hidden]) { animation: aparecer var(--duracion-media) var(--curva); }
@keyframes aparecer { from { opacity: 0; transform: translateY(-6px); } }

/* --- 4.13 CTA final y contacto --- */
.cta-final { position: relative; overflow: hidden; isolation: isolate; }
.cta-final .contenedor { display: grid; gap: var(--espacio-12); }
@media (min-width: 900px) { .cta-final .contenedor { grid-template-columns: 1.2fr .8fr; align-items: end; } }
.cta-final h2 { font-size: var(--texto-4xl); }
.cta-final .texto { font-size: var(--texto-lg); color: var(--color-texto-suave); margin-top: var(--espacio-4); max-width: 52ch; }
.contacto { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--espacio-4); font-style: normal; }
.contacto li { display: grid; grid-template-columns: 40px 1fr; gap: var(--espacio-4); align-items: center; }
.contacto .icono-caja { width: 40px; height: 40px; background: rgb(0 0 0 / .18); color: var(--color-texto); }
.contacto .icono-caja svg { width: 20px; height: 20px; }
.contacto a, .contacto span { font-weight: 500; }
.marca-agua { position: absolute; z-index: -1; right: -60px; bottom: -40px; width: min(560px, 70vw); color: var(--color-texto); opacity: .08; }

/* --- 4.14 Pie --- */
.pie { padding-block: var(--espacio-16) var(--espacio-8); border-top: 6px solid var(--color-primario); background: var(--color-oscuro-2); }
.pie-rejilla { display: grid; gap: var(--espacio-12); grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.pie .logo { color: var(--color-sobre-oscuro); display: inline-block; }
.pie .logo svg { height: 44px; width: auto; }
.pie h2 { font-size: var(--texto-xl); margin-bottom: var(--espacio-4); color: var(--color-texto); }
.pie p, .pie li { color: var(--color-texto-suave); font-size: var(--texto-sm); }
.pie .eslogan { margin-top: var(--espacio-4); max-width: 34ch; }
.pie ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--espacio-3); }
.red { display: inline-flex; align-items: center; gap: var(--espacio-3); }
.red svg { width: 18px; height: 18px; flex: none; }
.pie-legal { margin-top: var(--espacio-12); padding-top: var(--espacio-6); border-top: 1px solid var(--color-borde); display: flex; flex-wrap: wrap; gap: var(--espacio-2) var(--espacio-6); justify-content: space-between; }

/* --- 4.15 Volver arriba --- */
.volver-arriba {
  position: fixed; right: 20px; bottom: 20px; z-index: 45;
  width: 48px; height: 48px; display: grid; place-items: center;
  background: var(--color-oscuro); color: var(--color-sobre-oscuro);
  border: 1px solid rgb(255 255 255 / .16); border-radius: var(--radio-sm); cursor: pointer;
  box-shadow: var(--sombra-alta);
  opacity: 0; visibility: hidden; transform: translateY(12px);
  transition: opacity var(--duracion-media) var(--curva), transform var(--duracion-media) var(--curva), visibility var(--duracion-media);
  --color-foco: var(--color-neutro);
}
.volver-arriba.visible { opacity: 1; visibility: visible; transform: none; }
.volver-arriba:hover { background: var(--color-primario); border-color: var(--color-primario); }
.volver-arriba svg { width: 22px; height: 22px; }

/* ==========================================================================
   5. ANIMACIÓN DE APARICIÓN — solo si el sistema permite movimiento (.animar)
   ========================================================================== */
.animar .revelar {
  opacity: 0; transform: translateY(18px);
  transition: opacity var(--duracion-larga) var(--curva), transform var(--duracion-larga) var(--curva);
  transition-delay: calc(var(--i, 0) * var(--escalon));
}
.animar .revelar.visible { opacity: 1; transform: none; }

/* ==========================================================================
   6. MOVIMIENTO REDUCIDO — nada se mueve y todo se ve
   ========================================================================== */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  .revelar { opacity: 1 !important; transform: none !important; }
  .pista { width: auto; flex-wrap: wrap; justify-content: center; }
  .pista .grupo-aliados { flex-wrap: wrap; justify-content: center; row-gap: var(--espacio-4); }
  .pista .grupo-aliados[aria-hidden="true"] { display: none; }
  .marquesina { -webkit-mask: none; mask: none; }
}

/* ==========================================================================
   7. IMPRESIÓN Y PDF
   ========================================================================== */
@media print {
  @page { margin: 12mm; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; scroll-behavior: auto; }
  body { font-size: 11pt; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .revelar, .ilustracion .ilus-viga, .ilustracion .ilus-bulto { opacity: 1 !important; transform: none !important; }
  .riel, .volver-arriba, .saltar, .menu, .menu-boton, .boton-tema, .acciones-encabezado { display: none !important; }
  .encabezado { position: static; background: var(--color-oscuro); height: auto; padding-block: 12px; box-shadow: none; }
  .hero { min-height: 0; padding-block: var(--espacio-12); }
  .seccion { padding-block: var(--espacio-12); }
  .tarjeta, .plan, .testimonio, .cifra, .paso, .faq-item, .contacto li, .cabeza { break-inside: avoid; }
  h2, h3 { break-after: avoid; }
  .tarjeta:hover, .plan:hover { transform: none; box-shadow: none; }
  .plan--destacado { transform: none; }
  .pista { width: auto; flex-wrap: wrap; transform: none !important; }
  .pista .grupo-aliados { flex-wrap: wrap; row-gap: 12px; }
  .pista .grupo-aliados[aria-hidden="true"] { display: none; }
  .marquesina { -webkit-mask: none; mask: none; }
  .faq-panel[hidden] { display: block !important; }
  .faq-signo { display: none; }

  /* En papel se conserva el acomodo de escritorio, a escala de hoja */
  .contenedor { width: 100%; padding-inline: 18px; }
  .cabeza { margin-bottom: 20px; gap: 8px; }
  .cabeza h2, .cta-final h2 { font-size: 30pt; }
  .cabeza .intro, .cta-final .texto { font-size: 12pt; }
  .hero .contenedor { grid-template-columns: 1.3fr .7fr; gap: 24px; }
  .hero h1 { font-size: 44pt; margin-block: 12px; }
  .hero .subtitulo { font-size: 12pt; }
  .botones { margin-top: 16px; }
  .ilustracion { max-width: 260px; }
  .cifras, .planes, .testimonios { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 14px; }
  .cifra-valor { font-size: 34pt; }
  .rejilla { grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .galeria { grid-template-columns: repeat(4, 1fr); grid-auto-rows: 120px; gap: 8px; }
  .galeria-item { grid-column: span var(--c4, 1); break-inside: avoid; }
  .galeria-item figcaption { padding: 24px 10px 8px; }
  .galeria-item figcaption strong { font-size: 12pt; }
  .galeria-item--grande figcaption strong { font-size: 16pt; }
  .tarjeta--foto { padding-top: 0; }
  .tarjeta--foto .tarjeta-foto { margin: 0 -16px; }
  .tarjeta--foto .icono-caja { margin-top: -30px; }
  .tarjeta, .plan, .testimonio { padding: 16px; gap: 10px; }
  .tarjeta h3, .plan h3, .paso h3 { font-size: 16pt; }
  .plan-precio { font-size: 20pt; }
  .pasos { grid-template-columns: repeat(var(--n, 4), 1fr); gap: 14px; }
  .paso { padding-left: 0; padding-top: 64px; }
  .pasos::before { left: 26px; right: 26px; top: 25px; bottom: auto; width: auto; height: 2px; }

  const raiz = document.getElementById('raiz');
  const sinMovimiento = !document.documentElement.classList.contains('animar');
  let datos;
  try {
    datos = JSON.parse(document.getElementById('contenido').textContent);
  } catch (e) {
    raiz.innerHTML = '<p style="padding:2rem;font:1rem system-ui">El bloque de contenido tiene un error de formato JSON: ' + String(e.message).replace(/</g, '&lt;') + '</p>';
    console.error('Contenido JSON inválido:', e);
    return;
  }

  /* ---------- Utilidades ---------- */

  // Crea un elemento. Todo texto entra con textContent (nunca como HTML).
  function h(etiqueta, props, ...hijos) {
    const el = document.createElement(etiqueta);
    for (const [k, v] of Object.entries(props || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const hijo of hijos.flat(Infinity)) {
      if (hijo === null || hijo === undefined || hijo === false || hijo === '') continue;
      el.append(hijo instanceof Node ? hijo : document.createTextNode(String(hijo)));
    }
    return el;
  }
  const tiene = (v) => v !== undefined && v !== null && v !== '' && !(Array.isArray(v) && v.length === 0);
  const lista = (v) => (Array.isArray(v) ? v : tiene(v) ? [v] : []);

  // Enlaces: se bloquean esquemas peligrosos; los externos abren en otra pestaña.
  function enlaceSeguro(url) {
    if (!tiene(url)) return null;
    const s = String(url).trim();
    return /^(javascript|data|vbscript):/i.test(s) ? null : s;
  }
  function atributosEnlace(url) {
    const href = enlaceSeguro(url);
    const externo = href && /^https?:\/\//i.test(href);
    return { href, target: externo ? '_blank' : null, rel: externo ? 'noopener' : null };
  }

  // Párrafos: acepta texto o arreglo de textos.
  const parrafos = (v, clase) => lista(v).map((t) => h('p', { class: clase, text: t }));

  // Íconos SVG (trazo 2 px, estilo industrial). Se eligen por nombre en el JSON.
  const ICONOS = {
    rack: '<path d="M4 3v18M20 3v18M4 8h16M4 14h16M4 20h16"/><path d="M7 8V5.5h4V8M13 14v-3h4v3"/>',
    mezzanine: '<path d="M2 10h20M4 10v11M20 10v11M12 10v11"/><path d="M4 21l8-11"/><path d="M4 6h16M4 6v4M20 6v4"/>',
    montacargas: '<path d="M3 17V9h6l3 4v4"/><path d="M15 3v14h6"/><circle cx="6" cy="18.5" r="1.8"/><circle cx="11.5" cy="18.5" r="1.8"/>',
    escudo: '<path d="M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
    camion: '<path d="M2 6h11v10H2zM13 9h4l4 4v3h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
    regla: '<path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/>',
    casco: '<path d="M3 18h18M5 18v-3a7 7 0 0 1 14 0v3"/><path d="M10 8V5h4v3"/>',
    engrane: '<circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
    grafica: '<path d="M3 21h18M6 17V11M11 17V6M16 17v-8M21 17V4"/>',
    reloj: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    check: '<path d="M4 12.5l5 5L20 6.5"/>',
    flecha: '<path d="M4 12h15M13 6l6 6-6 6"/>',
    arriba: '<path d="M12 20V5M6 11l6-6 6 6"/>',
    correo: '<rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 7l9 6 9-6"/>',
    telefono: '<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
    sitio: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    ubicacion: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    whatsapp: '<path d="M4 20l1.3-3.9A8.5 8.5 0 1 1 8 19z"/><path d="M9 9.5c.3 2.3 2.2 4.2 4.5 4.5l1-1.3 2 1-1 2c-3.5.2-7.7-4-7.5-7.5l2-1 1 2z"/>',
    facebook: '<path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/>',
    instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',
    linkedin: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/>',
    youtube: '<rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/>',
    sol: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
    luna: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
    menu: '<path d="M3 6h18M3 12h18M3 18h18"/>',
    cerrar: '<path d="M5 5l14 14M19 5L5 19"/>'
  };
  function icono(nombre, clase) {
    const cuerpo = ICONOS[nombre] || ICONOS.rack;
    const t = document.createElement('template');
    t.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + cuerpo + '</svg>';
    const svg = t.content.firstElementChild;
    if (clase) svg.setAttribute('class', clase);
    return svg;
  }

  // Logotipo desde <template>. decorativo = sin nombre accesible.
  function logo(id, decorativo) {
    const svg = document.getElementById(id).content.firstElementChild.cloneNode(true);
    if (decorativo) { svg.setAttribute('aria-hidden', 'true'); svg.removeAttribute('role'); svg.querySelector('title')?.remove(); }
    return svg;
  }

  function boton(cta, variante, conFlecha) {
    if (!cta || !tiene(cta.texto)) return null;
    const a = atributosEnlace(cta.enlace);
    return h('a', { class: 'boton boton--' + variante, ...a }, cta.texto, conFlecha ? icono('flecha') : null);
  }

  // Foto con versión chica opcional ("chica": miniatura de 640 px): el navegador elige la que
  // le toca según el ancho en pantalla, así el celular no baja la de 1920 px.
  // opciones.sizes = ancho que ocupa en pantalla · opciones.prioridad = foto principal (no se difiere).
  function imagen(img, clase, opciones) {
    if (!img || !tiene(img.src)) return null;
    opciones = opciones || {};
    if (!tiene(img.alt)) console.warn('Imagen sin "alt":', img.src);
    const conChica = tiene(img.chica);
    return h('figure', { class: 'foto ' + (img.color ? 'foto--color ' : '') + (clase || '') },
      h('img', {
        src: conChica && !opciones.prioridad ? img.chica : img.src,
        srcset: conChica ? img.chica + ' 640w, ' + img.src + ' ' + (img.ancho || 1920) + 'w' : null,
        sizes: conChica ? (opciones.sizes || '100vw') : null,
        alt: img.alt || '',
        loading: opciones.prioridad ? 'eager' : 'lazy',
        fetchpriority: opciones.prioridad ? 'high' : null,
        decoding: 'async'
      }));
  }

  // Título con una parte resaltada (bloque rojo detrás del texto).
  function tituloConResaltado(texto, resaltado) {
    if (!tiene(resaltado) || !String(texto).includes(resaltado)) return [texto];
    const [antes, ...resto] = String(texto).split(resaltado);
    return [antes, h('span', { class: 'resaltado', text: resaltado }), resto.join(resaltado)];
  }

  // Numeración automática de secciones ("01", "02"...)
  let numeroSeccion = 0;
  function cabeza(s, opciones) {
    opciones = opciones || {};
    if (!tiene(s.titulo) && !tiene(s.etiqueta) && !tiene(s.intro)) return null;
    if (opciones.numerar !== false) numeroSeccion += 1;
    const idTitulo = (s.ancla || s.tipo + '-' + numeroSeccion) + '-titulo';
    s._idTitulo = tiene(s.titulo) ? idTitulo : null;
    return h('div', { class: 'cabeza revelar' + (opciones.centro ? ' cabeza--centro' : '') },
      tiene(s.etiqueta) || opciones.numerar !== false
        ? h('p', { class: 'etiqueta' },
            opciones.numerar === false ? null : h('span', { class: 'numero', text: String(numeroSeccion).padStart(2, '0') }),
            tiene(s.etiqueta) ? s.etiqueta : null)
        : null,
      tiene(s.titulo) ? h('h2', { id: idTitulo, text: s.titulo }) : null,
      parrafos(s.intro, 'intro'));
  }

  // Envoltura común de sección
  function seccion(s, clases, ...hijos) {
    const el = h('section', { id: enlaceSeguro(s.ancla), class: 'seccion ' + (clases || '') }, h('div', { class: 'contenedor' }, ...hijos));
    if (s._idTitulo) el.setAttribute('aria-labelledby', s._idTitulo);
    return el;
  }

  // Asigna el índice de escalonado a hermanos
  const escalonar = (elementos) => elementos.forEach((el, i) => { el.classList.add('revelar'); el.style.setProperty('--i', i); });

  /* ---------- Ilustración de rack (mientras no haya foto) ---------- */
  function ilustracionRack() {
    const postes = [30, 252, 474];
    const niveles = [118, 222, 326];          // altura de las vigas
    const bahias = [[46, 252], [268, 474]];
    let svg = '<svg class="ilustracion revelar" viewBox="0 0 520 440" aria-hidden="true" focusable="false">';
    // Piso y cota
    svg += '<line class="ilus-piso" x1="0" y1="412" x2="520" y2="412"/>';
    svg += '<path class="ilus-cota" d="M508 20v392M502 20h12M502 412h12"/>';
    // Postes con perforaciones
    postes.forEach((x) => {
      svg += '<rect class="ilus-poste" x="' + x + '" y="20" width="16" height="392" rx="2"/>';
      for (let y = 30; y < 404; y += 18) svg += '<rect class="ilus-perfo" x="' + (x + 6) + '" y="' + y + '" width="4" height="9" rx="2"/>';
    });
    // Vigas (se animan) y cargas
    let iv = 0, ic = 0;
    const cargas = [
      [[62, 66], [150, 58]], [[62, 74], [150, 66, true]], [[62, 60], [150, 72]],
      [[284, 70], [372, 62]], [[284, 58], null], [[284, 66], [372, 74]]
    ];
    bahias.forEach(([x1, x2], b) => {
      niveles.forEach((y, n) => {
        svg += '<rect class="ilus-viga" style="--i:' + (iv++) + '" x="' + x1 + '" y="' + y + '" width="' + (x2 - x1) + '" height="11" rx="2"/>';
        const par = cargas[b * 3 + n];
        par.forEach((c) => {
          if (!c) return;
          const cx = b === 0 ? c[0] : c[0], alto = c[1], acento = c[2];
          const yTarima = (n === 0 ? y : y) - 9, yCarga = yTarima - alto;
          svg += '<g class="ilus-bulto" style="--i:' + (ic++) + '">' +
                 '<rect class="ilus-tarima" x="' + cx + '" y="' + yTarima + '" width="80" height="8" rx="1"/>' +
                 '<rect class="ilus-carga' + (acento ? ' ilus-carga--acento' : '') + '" x="' + (cx + 3) + '" y="' + yCarga + '" width="74" height="' + (alto - 1) + '" rx="1"/></g>';
        });
      });
      // Cargas a piso
      svg += '<g class="ilus-bulto" style="--i:' + (ic++) + '"><rect class="ilus-tarima" x="' + (x1 + 16) + '" y="403" width="80" height="8" rx="1"/><rect class="ilus-carga" x="' + (x1 + 19) + '" y="336" width="74" height="66" rx="1"/></g>';
    });
    svg += '</svg>';
    const t = document.createElement('template');
    t.innerHTML = svg;
    return t.content.firstElementChild;
  }

  /* ---------- Renderizadores por tipo de sección ---------- */
  const secciones = lista(datos.secciones);
  const marca = datos.marca || {};

  const R = {
    encabezado(s) {
      const anclas = secciones.filter((x) => tiene(x.menu) && tiene(x.ancla));
      const menuId = 'menu-principal';
      const botonMenu = h('button', { class: 'boton-icono menu-boton', type: 'button', 'aria-expanded': 'false', 'aria-controls': menuId, 'aria-label': 'Abrir menú' }, icono('menu'));
      const botonTema = h('button', { class: 'boton-icono boton-tema', type: 'button', 'aria-label': 'Cambiar entre modo claro y oscuro' },
        icono('sol', 'icono-sol'), icono('luna', 'icono-luna'));
      const header = h('header', { class: 'encabezado', id: 'encabezado' },
        h('div', { class: 'contenedor' },
          h('a', { class: 'logo', href: '#contenido', 'aria-label': (marca.nombre || 'Inicio') + ' — ir al inicio' }, logo('tpl-logo', true)),
          anclas.length ? h('nav', { class: 'menu', id: menuId, 'aria-label': 'Principal' },
            h('ul', {}, anclas.map((x) => h('li', {}, h('a', { class: 'enlace', href: '#' + x.ancla, text: x.menu }))))) : null,
          h('div', { class: 'acciones-encabezado' },
            boton(s.cta, 'primario boton--chico', false),
            botonTema,
            anclas.length ? botonMenu : null)));

      botonMenu.addEventListener('click', () => {
        const abierto = header.classList.toggle('abierto');
        botonMenu.setAttribute('aria-expanded', String(abierto));
        botonMenu.setAttribute('aria-label', abierto ? 'Cerrar menú' : 'Abrir menú');
        botonMenu.replaceChildren(icono(abierto ? 'cerrar' : 'menu'));
      });
      header.addEventListener('click', (e) => {
        if (e.target.closest('.menu a') && header.classList.contains('abierto')) botonMenu.click();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && header.classList.contains('abierto')) { botonMenu.click(); botonMenu.focus(); }
      });
      botonTema.addEventListener('click', () => {
        const nuevo = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nuevo);
        try { localStorage.setItem('rt-tema', nuevo); } catch (e) {}
      });
      return header;
    },

    hero(s) {
      const visual = imagen(s.imagen, 'revelar', { prioridad: true, sizes: '(min-width: 900px) 45vw, 100vw' }) || (s.ilustracion === false ? null : ilustracionRack());
      const texto = h('div', {},
        tiene(s.etiqueta) ? h('p', { class: 'etiqueta revelar', style: '--i:0', text: s.etiqueta }) : null,
        tiene(s.titulo) ? h('h1', { class: 'revelar', style: '--i:1' }, tituloConResaltado(s.titulo, s.resaltado)) : null,
        tiene(s.subtitulo) ? h('p', { class: 'subtitulo revelar', style: '--i:2', text: s.subtitulo }) : null,
        (s.cta_primario || s.cta_secundario) ? h('div', { class: 'botones revelar', style: '--i:3' },
          boton(s.cta_primario, 'primario', true), boton(s.cta_secundario, 'secundario', false)) : null);
      return h('section', { class: 'hero bloque-oscuro', id: enlaceSeguro(s.ancla), 'aria-label': 'Presentación' },
        h('div', { class: 'contenedor' }, texto, visual ? h('div', { class: 'hero-visual' }, visual) : null));
    },

    cifras(s) {
      const items = lista(s.items).filter((c) => tiene(c.valor));
      if (!items.length) return null;
      const cab = cabeza(s);
      const nodos = items.map((c) => {
        const num = typeof c.valor === 'number';
        const fmt = new Intl.NumberFormat('es-MX', { maximumFractionDigits: c.decimales || 0, minimumFractionDigits: c.decimales || 0, useGrouping: c.agrupar !== false });
        const valor = h('span', num ? { class: 'contador', 'data-valor': c.valor, 'data-decimales': c.decimales || 0, 'data-agrupar': c.agrupar === false ? 'false' : 'true' } : {}, num ? fmt.format(c.valor) : String(c.valor));
        return h('div', { class: 'cifra' },
          h('p', { class: 'cifra-valor' },
            tiene(c.prefijo) ? h('span', { class: 'cifra-afijo', text: c.prefijo }) : null, valor,
            tiene(c.sufijo) ? h('span', { class: 'cifra-afijo', text: c.sufijo }) : null),
          tiene(c.etiqueta) ? h('p', { class: 'cifra-etiqueta', text: c.etiqueta }) : null,
          tiene(c.nota) ? h('p', { class: 'cifra-nota', text: c.nota }) : null);
      });
      escalonar(nodos);
      return seccion(s, 'seccion--superficie', cab, h('div', { class: 'cifras' }, nodos));
    },

    beneficios(s) {
      const items = lista(s.items);
      if (!items.length) return null;
      const cab = cabeza(s);
      const nodos = items.map((b) => {
        const foto = imagen(b.imagen, 'tarjeta-foto', { sizes: '(min-width: 1200px) 290px, (min-width: 640px) 45vw, 100vw' });
        return h('article', { class: 'tarjeta' + (foto ? ' tarjeta--foto' : '') },
          foto,
          h('div', { class: 'icono-caja' }, icono(b.icono || 'rack')),
          tiene(b.titulo) ? h('h3', { text: b.titulo }) : null,
          parrafos(b.texto));
      });
      escalonar(nodos);
      return seccion(s, '', cab, h('div', { class: 'rejilla' }, nodos));
    },

    // Galería de proyectos: la primera foto va grande (2 × 2) y la última se estira lo necesario
    // para que la rejilla cierre sin huecos, tanto a 4 columnas como a 2.
    galeria(s) {
      const items = lista(s.items).filter((g) => g.imagen && tiene(g.imagen.src));
      if (!items.length) return null;
      const cab = cabeza(s);
      const n = items.length;
      const celdas4 = n > 1 ? 4 + (n - 1) : 1, resto4 = celdas4 % 4;      // a 4 columnas
      const resto2 = n > 1 ? (n - 1) % 2 : 0;                              // a 2 columnas
      const nodos = items.map((g, i) => {
        let c4 = 1, c2 = 1;
        if (i === 0 && n > 1) { c4 = 2; c2 = 2; }
        const ultimo = i === n - 1, penultimo = i === n - 2;
        if (resto4 === 1 && ultimo) c4 = 4;                   // queda sola: panorámica a todo lo ancho
        if (resto4 === 2 && (ultimo || penultimo) && i > 0) c4 = 2;
        if (resto4 === 3 && ultimo && i > 0) c4 = 2;
        if (resto2 === 1 && ultimo && i > 0) c2 = 2;
        const grande = i === 0 && n > 1;
        return h('figure', { class: 'galeria-item' + (grande ? ' galeria-item--grande' : ''), style: '--c4:' + c4 + ';--c2:' + c2 },
          imagen(g.imagen, '', { sizes: grande ? '(min-width: 960px) 600px, 100vw' : '(min-width: 960px) 300px, 50vw' }),
          (tiene(g.titulo) || tiene(g.texto)) ? h('figcaption', {},
            tiene(g.titulo) ? h('strong', { text: g.titulo }) : null,
            tiene(g.texto) ? h('span', { text: g.texto }) : null) : null);
      });
      escalonar(nodos);
      return seccion(s, 'seccion--superficie', cab, h('div', { class: 'galeria' }, nodos),
        tiene(s.nota) ? h('p', { class: 'galeria-nota revelar', text: s.nota }) : null);
    },

    pasos(s) {
      const items = lista(s.items);
      if (!items.length) return null;
      const cab = cabeza(s);
      const nodos = items.map((p, i) => h('li', { class: 'paso' },
        h('span', { class: 'paso-numero', 'aria-hidden': 'true', text: String(i + 1).padStart(2, '0') }),
        tiene(p.titulo) ? h('h3', {}, h('span', { class: 'solo-lectores', text: 'Paso ' + (i + 1) + ': ' }), p.titulo) : null,
        parrafos(p.texto)));
      escalonar(nodos);
      return seccion(s, 'seccion--superficie', cab, h('ol', { class: 'pasos', style: '--n:' + Math.min(items.length, 5) }, nodos));
    },

    planes(s) {
      const items = lista(s.items);
      if (!items.length) return null;
      const cab = cabeza(s);
      const nodos = items.map((p) => h('article', { class: 'plan' + (p.destacado ? ' plan--destacado bloque-oscuro' : '') },
        p.destacado && tiene(p.insignia) ? h('span', { class: 'insignia', text: p.insignia }) : null,
        tiene(p.nombre) ? h('h3', { text: p.nombre }) : null,
        tiene(p.descripcion) ? h('p', { class: 'plan-descripcion', text: p.descripcion }) : null,
        tiene(p.precio) ? h('p', { class: 'plan-precio', text: p.precio }) : null,
        tiene(p.nota_precio) ? h('p', { class: 'plan-nota', text: p.nota_precio }) : null,
        lista(p.incluye).length ? h('ul', { class: 'lista-check' }, lista(p.incluye).map((x) => h('li', {}, icono('check'), h('span', { text: x })))) : null,
        p.cta ? h('div', { class: 'plan-pie' }, boton(p.cta, p.destacado ? 'primario' : 'secundario', p.destacado)) : null));
      escalonar(nodos);
      return seccion(s, '', cab, h('div', { class: 'planes' }, nodos));
    },

    testimonios(s) {
      const items = lista(s.items).filter((t) => tiene(t.cita));
      if (!items.length) return null;
      const cab = cabeza(s);
      const nodos = items.map((t) => h('figure', { class: 'testimonio' },
        t.ejemplo ? h('span', { class: 'marca-ejemplo', text: 'Ejemplo · reemplazar' }) : null,
        h('blockquote', {}, h('p', { text: t.cita })),
        h('figcaption', {},
          tiene(t.nombre) ? h('strong', { text: t.nombre }) : null,
          (tiene(t.cargo) || tiene(t.empresa)) ? h('span', { text: [t.cargo, t.empresa].filter(tiene).join(' · ') }) : null)));
      escalonar(nodos);
      return seccion(s, '', cab, h('div', { class: 'testimonios' }, nodos));
    },

    // Casos reales: logo del cliente + qué se le hizo. Sin citas: un testimonio solo va si el
    // cliente lo dijo y autorizó publicarlo (para eso existe el tipo «testimonios»).
    casos(s) {
      const items = lista(s.items).filter((c) => tiene(c.cliente));
      if (!items.length) return null;
      const cab = cabeza(s);
      const nodos = items.map((c) => h('article', { class: 'caso' },
        h('div', { class: 'caso-logo' }, tiene(c.logo)
          ? h('img', { src: c.logo, alt: c.cliente, loading: 'lazy' })
          : h('span', { class: 'aliado-nombre', text: c.cliente })),
        h('div', { class: 'caso-txt' },
          tiene(c.sector) ? h('p', { class: 'caso-sector', text: c.sector }) : null,
          h('h3', { text: c.cliente }),
          tiene(c.proyecto) ? h('p', { class: 'caso-proyecto' }, h('strong', { text: 'Proyecto: ' }), c.proyecto) : null,
          parrafos(c.texto, 'caso-nota'))));
      escalonar(nodos);
      return seccion(s, '', cab, h('div', { class: 'casos' }, nodos));
    },

    aliados(s) {
      const items = lista(s.items).filter((a) => tiene(a.nombre) || tiene(a.logo));
      if (!items.length) return null;
      const cab = cabeza(s, { centro: true, numerar: false });
      const grupo = (oculto) => h('ul', { class: 'grupo-aliados', 'aria-hidden': oculto ? 'true' : null },
        items.map((a) => h('li', { class: 'aliado' },
          tiene(a.logo) ? h('img', { src: a.logo, alt: oculto ? '' : (a.nombre || ''), loading: 'lazy' }) : h('span', { class: 'aliado-nombre', text: a.nombre }))));
      const el = h('section', { class: 'aliados', id: enlaceSeguro(s.ancla), 'aria-label': s.titulo || 'Aliados' },
        h('div', { class: 'contenedor' }, cab),
        h('div', { class: 'marquesina revelar', style: s.velocidad ? '--velocidad:' + Number(s.velocidad) + 's' : null },
          h('div', { class: 'pista' }, grupo(false), grupo(true))));
      return el;
    },

    preguntas(s) {
      const items = lista(s.items).filter((p) => tiene(p.pregunta));
      if (!items.length) return null;
      const cab = cabeza(s, { centro: true });
      const nodos = items.map((p, i) => {
        const idP = 'faq-' + i, idB = 'faq-b-' + i;
        const panel = h('div', { class: 'faq-panel', id: idP, role: 'region', 'aria-labelledby': idB, hidden: true }, parrafos(p.respuesta));
        const btn = h('button', { class: 'faq-boton', id: idB, type: 'button', 'aria-expanded': 'false', 'aria-controls': idP },
          h('span', { text: p.pregunta }), h('span', { class: 'faq-signo', 'aria-hidden': 'true' }));
        btn.addEventListener('click', () => {
          const abierto = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', String(!abierto));
          panel.hidden = abierto;
        });
        return h('div', { class: 'faq-item' }, h('h3', {}, btn), panel);
      });
      escalonar(nodos);
      return seccion(s, 'seccion--superficie', cab, h('div', { class: 'faq' }, nodos));
    },

    cta(s) {
      const contactos = lista(s.contacto).filter((c) => tiene(c.valor));
      const el = h('section', { class: 'seccion cta-final bloque-primario', id: enlaceSeguro(s.ancla) },
        h('div', { class: 'contenedor' },
          h('div', {},
            cabeza(s),
            parrafos(s.texto, 'texto revelar'),
            (s.cta_primario || s.cta_secundario) ? h('div', { class: 'botones revelar' }, boton(s.cta_primario, 'primario', true), boton(s.cta_secundario, 'secundario', false)) : null),
          contactos.length ? h('address', {}, h('ul', { class: 'contacto' }, contactos.map((c, i) => {
            const a = atributosEnlace(c.enlace);
            return h('li', { class: 'revelar', style: '--i:' + i },
              h('span', { class: 'icono-caja' }, icono(c.tipo || 'sitio')),
              a.href ? h('a', { class: 'enlace', ...a, text: c.valor }) : h('span', { text: c.valor }));
          }))) : null),
        (() => { const m = logo('tpl-isotipo', true); m.setAttribute('class', 'marca-agua'); return m; })());
      if (s._idTitulo) el.setAttribute('aria-labelledby', s._idTitulo);
      if (!s.titulo && !contactos.length && !s.cta_primario) return null;
      return el;
    },

    pie(s) {
      const redes = lista(s.redes).filter((r) => tiene(r.nombre));
      const contacto = lista(s.contacto);
      return h('footer', { class: 'pie bloque-oscuro' },
        h('div', { class: 'contenedor' },
          h('div', { class: 'pie-rejilla' },
            h('div', {},
              h('a', { class: 'logo', href: '#contenido', 'aria-label': (marca.nombre || 'Inicio') + ' — ir al inicio' }, logo('tpl-logo', true)),
              tiene(marca.eslogan) ? h('p', { class: 'eslogan', text: marca.eslogan }) : null),
            (tiene(s.direccion) || contacto.length) ? h('div', {},
              h('h2', { text: 'Contacto' }),
              h('address', { style: 'font-style:normal' }, h('ul', {},
                tiene(s.direccion) ? h('li', { text: s.direccion }) : null,
                contacto.map((c) => h('li', { text: c }))))) : null,
            redes.length ? h('div', {},
              h('h2', { text: 'Redes' }),
              h('ul', {}, redes.map((r) => {
                const a = atributosEnlace(r.url);
                const cuerpo = [icono(r.red || 'sitio'), h('span', { text: r.nombre })];
                return h('li', {}, a.href ? h('a', { class: 'red enlace', ...a, 'aria-label': (r.red || '') + ' ' + r.nombre }, cuerpo) : h('span', { class: 'red' }, cuerpo));
              }))) : null),
          h('div', { class: 'pie-legal' },
            h('p', { text: '© ' + new Date().getFullYear() + ' ' + (marca.nombre || '') }),
            tiene(s.legal) ? h('p', { text: s.legal }) : null)));
    }
  };

  /* ---------- Armado de la página ---------- */
  // El título y la descripción de la página viven en el <head> (tarjeta para compartir).

  const principal = h('main', { id: 'contenido', tabindex: '-1' });
  let encabezado = null, pie = null;
  secciones.forEach((s) => {
    if (!s || !R[s.tipo]) { if (s && s.tipo) console.warn('Tipo de sección desconocido:', s.tipo); return; }
    const nodo = R[s.tipo](s);
    if (!nodo) return;
    if (s.tipo === 'encabezado') encabezado = nodo;
    else if (s.tipo === 'pie') pie = nodo;
    else principal.append(nodo);
  });
  const riel = h('div', { class: 'riel', 'aria-hidden': 'true' }, h('span'));
  const volver = h('button', { class: 'volver-arriba', type: 'button', 'aria-label': 'Volver arriba' }, icono('arriba'));
  raiz.append(...[encabezado, riel, principal, pie, volver].filter(Boolean));

  /* ---------- Comportamiento ---------- */
  const primeraEsHero = principal.firstElementChild && principal.firstElementChild.classList.contains('hero');
  if (encabezado && !primeraEsHero) {
    encabezado.classList.add('solido');
    principal.style.paddingTop = 'var(--alto-encabezado)';
  }

  // Scroll: encabezado sólido, progreso de lectura y botón "volver arriba"
  let pendiente = false;
  function alDesplazar() {
    pendiente = false;
    const y = window.scrollY;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    document.documentElement.style.setProperty('--progreso', max > 0 ? Math.min(1, y / max).toFixed(4) : 0);
    if (encabezado && primeraEsHero) encabezado.classList.toggle('solido', y > 24);
    volver.classList.toggle('visible', y > 600);
  }
  window.addEventListener('scroll', () => { if (!pendiente) { pendiente = true; requestAnimationFrame(alDesplazar); } }, { passive: true });
  window.addEventListener('resize', alDesplazar);
  alDesplazar();

  volver.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: sinMovimiento ? 'auto' : 'smooth' });
    principal.focus({ preventScroll: true });
  });

  // Contadores
  function contar(el) {
    if (el.dataset.contado) return;
    el.dataset.contado = '1';
    const fin = parseFloat(el.dataset.valor), dec = +el.dataset.decimales || 0;
    const fmt = new Intl.NumberFormat('es-MX', { minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: el.dataset.agrupar !== 'false' });
    if (sinMovimiento) { el.textContent = fmt.format(fin); return; }
    const t0 = performance.now(), dur = 700;
    const paso = (t) => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt.format(k < 1 ? fin * e : fin);
      if (k < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  }

  // Aparición al entrar en pantalla
  const observables = raiz.querySelectorAll('.revelar, .paso, .contador');
  if ('IntersectionObserver' in window && !sinMovimiento) {
    const io = new IntersectionObserver((entradas) => {
      entradas.forEach((en) => {
        if (!en.isIntersecting) return;
        en.target.classList.add('visible');
        if (en.target.classList.contains('contador')) contar(en.target);
        io.unobserve(en.target);
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
    observables.forEach((el) => io.observe(el));
  } else {
    observables.forEach((el) => { el.classList.add('visible'); if (el.classList.contains('contador')) contar(el); });
  }

  // Menú: marca la sección visible
  const enlacesMenu = [...raiz.querySelectorAll('.menu a')];
  if (enlacesMenu.length && 'IntersectionObserver' in window) {
    const porId = new Map(enlacesMenu.map((a) => [a.getAttribute('href').slice(1), a]));
    const ioMenu = new IntersectionObserver((entradas) => {
      entradas.forEach((en) => {
        const a = porId.get(en.target.id);
        if (a && en.isIntersecting) { enlacesMenu.forEach((x) => x.removeAttribute('aria-current')); a.setAttribute('aria-current', 'true'); }
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    porId.forEach((_, id) => { const sec = document.getElementById(id); if (sec) ioMenu.observe(sec); });
  }

  // Tema del sistema: si la persona no eligió uno, sigue al sistema
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
    let guardado = null;
    try { guardado = localStorage.getItem('rt-tema'); } catch (err) {}
    if (!guardado) document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
  });

  // Impresión: todo visible, cifras finales y modo claro
  let temaAntes = null;
  window.addEventListener('beforeprint', () => {
    observables.forEach((el) => el.classList.add('visible'));
    raiz.querySelectorAll('.contador').forEach((el) => {
      el.dataset.contado = '1';
      const dec = +el.dataset.decimales || 0;
      el.textContent = new Intl.NumberFormat('es-MX', { minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: el.dataset.agrupar !== 'false' }).format(parseFloat(el.dataset.valor));
    });
    temaAntes = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', 'light');
  });
  window.addEventListener('afterprint', () => { if (temaAntes) document.documentElement.setAttribute('data-theme', temaAntes); });
})();
</script>
</body>
</html>
