<script>
  (function () {
    var tema = null;
    try { tema = localStorage.getItem('rt-tema'); } catch (e) {}
    if (tema !== 'light' && tema !== 'dark') {
      tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', tema);
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('animar');
    }
  })();
</script>

<style>
/* ==========================================================================
   MODELO DIAPOSITIVAS — RACK-T
   Lienzo fijo de 1920 × 1080 (16:9) que se escala para caber en la pantalla.
   Todas las medidas de las diapositivas están en px del lienzo.
   El contenido vive en <script id="contenido"> al final. Guía: COMO-USAR.md.
   ========================================================================== */

/* ==========================================================================
   1. TOKENS DE MARCA — el único bloque que se edita para cambiar la marca
   Fuente: Brand Book RACK-T 2025
   ========================================================================== */
:root {
  /* Colores de marca */
  --color-primario: #ab0505;          /* Rojo RACK-T */
  --color-secundario: #323131;        /* Grafito */
  --color-neutro: #dfdfdf;            /* Gris */
  --color-acento: #002455;            /* Azul marino · información y foco */
  --color-destacado: #f8450d;         /* Naranja · SOLO acentos gráficos, nunca texto */
  --color-exito: #1d6b47;
  --color-alerta: #9a5c00;
  --color-blanco: #ffffff;

  /* Tintes derivados */
  --color-neutro-claro: #f4f4f4;
  --color-neutro-medio: #bdbdbd;
  --color-secundario-medio: #4a4848;
  --color-secundario-profundo: #242323;
  --color-secundario-noche: #1a1919;
  --color-letterbox: #111010;         /* franjas fuera del lienzo 16:9 */

  /* Variantes para fondo oscuro */
  --color-acento-oscuro: #8fb3e8;
  --color-exito-oscuro: #62c795;
  --color-alerta-oscuro: #f0aa4a;

  /* Tipografía */
  --fuente-titulos: "League Gothic", "Oswald", "Arial Narrow", Impact, sans-serif;
  --fuente-cuerpo: "Bahnschrift", "Barlow", "Segoe UI", system-ui, sans-serif;
  --tracking-titulos: 0.03em;
  --tracking-etiquetas: 0.14em;

  /* Escala tipográfica del lienzo (px de 1920 × 1080) */
  --d-etiqueta: 26px;
  --d-texto: 36px;
  --d-texto-grande: 44px;
  --d-titulo: 112px;
  --d-titulo-grande: 168px;
  --d-cifra: 190px;

  /* Espaciado del lienzo */
  --d-margen-x: 128px;
  --d-margen-arriba: 108px;
  --d-margen-abajo: 120px;
  --espacio-2: 8px; --espacio-3: 12px; --espacio-4: 16px; --espacio-6: 24px;
  --espacio-8: 32px; --espacio-12: 48px; --espacio-16: 64px; --espacio-24: 96px;

  /* Forma */
  --radio-sm: 2px;
  --radio: 6px;
  --radio-barra: 999px;
  --sombra: 0 2px 6px rgb(0 0 0 / .08), 0 20px 48px rgb(0 0 0 / .12);

  /* Movimiento */
  --duracion-corta: 200ms;
  --duracion-media: 450ms;
  --duracion-larga: 650ms;
  --curva: cubic-bezier(.2, .7, .2, 1);
  --escalon: 90ms;
}

/* ==========================================================================
   2. ROLES DE COLOR — claro y oscuro
   ========================================================================== */
:root {
  --color-fondo: var(--color-blanco);
  --color-superficie: var(--color-neutro-claro);
  --color-texto: var(--color-secundario);
  --color-texto-suave: var(--color-secundario-medio);
  --color-borde: var(--color-neutro);
  --color-marca-texto: var(--color-primario);
  --color-barra: var(--color-primario);
  --color-info: var(--color-acento);
  --color-foco: var(--color-acento);
  --color-oscuro: var(--color-secundario);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --color-fondo: var(--color-secundario-profundo);
  --color-superficie: var(--color-secundario);
  --color-texto: var(--color-neutro);
  --color-texto-suave: var(--color-neutro-medio);
  --color-borde: var(--color-secundario-medio);
  --color-marca-texto: var(--color-neutro-medio);   /* el rojo no se usa como texto en oscuro */
  --color-info: var(--color-acento-oscuro);
  --color-foco: var(--color-neutro);
  --color-oscuro: var(--color-secundario-noche);
  color-scheme: dark;
}
/* Fondo de cada diapositiva: claro (sigue el tema), oscuro o primario */
.fondo-claro { background: var(--color-fondo); color: var(--color-texto); }
.fondo-oscuro {
  --color-texto: var(--color-neutro);
  --color-texto-suave: var(--color-neutro-medio);
  --color-borde: rgb(255 255 255 / .14);
  --color-superficie: rgb(255 255 255 / .05);
  --color-marca-texto: var(--color-neutro-medio);
  --color-info: var(--color-acento-oscuro);
  --color-foco: var(--color-neutro);
  --color-fondo: var(--color-oscuro);
  background: var(--color-oscuro); color: var(--color-texto);
}
.fondo-primario {
  --color-texto: var(--color-blanco);
  --color-texto-suave: rgb(255 255 255 / .88);
  --color-borde: rgb(255 255 255 / .3);
  --color-superficie: rgb(0 0 0 / .14);
  --color-marca-texto: var(--color-blanco);
  --color-barra: var(--color-blanco);
  --color-info: var(--color-blanco);
  --color-foco: var(--color-blanco);
  --color-fondo: var(--color-primario);
  background: var(--color-primario); color: var(--color-texto);
}

/* ==========================================================================
   3. BASE Y ESCENARIO (lienzo escalado con letterbox)
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--color-letterbox);
  font-family: var(--fuente-cuerpo);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .titulo {
  font-family: var(--fuente-titulos); font-weight: 400; letter-spacing: var(--tracking-titulos);
  line-height: .98; text-transform: uppercase; margin: 0; text-wrap: balance;
}
p, ul, ol, figure, blockquote { margin: 0; }
img, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--color-foco); outline-offset: 3px; }

.escenario {
  position: fixed; inset: 0; overflow: hidden;
  touch-action: pan-y pinch-zoom;              /* el deslizamiento horizontal lo manejamos nosotros */
  user-select: none; -webkit-user-select: none;
}
.lienzo {
  position: absolute; left: 50%; top: 50%;
  width: 1920px; height: 1080px;
  transform: translate(-50%, -50%) scale(var(--escala, 1));
  overflow: hidden;
  background: var(--color-fondo);
}
.solo-lectores { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ==========================================================================
   4. DIAPOSITIVAS
   ========================================================================== */
.diapositiva {
  position: absolute; inset: 0; overflow: hidden; isolation: isolate;
  padding: var(--d-margen-arriba) var(--d-margen-x) var(--d-margen-abajo);
  display: flex; flex-direction: column;
  font-size: var(--d-texto); line-height: 1.4;
  opacity: 0; visibility: hidden; transform: translateX(80px);
  transition: opacity var(--duracion-media) var(--curva), transform var(--duracion-media) var(--curva), visibility 0s linear var(--duracion-media);
}
.diapositiva.previa { transform: translateX(-80px); }
.diapositiva.activa {
  opacity: 1; visibility: visible; transform: none;
  transition: opacity var(--duracion-media) var(--curva), transform var(--duracion-media) var(--curva), visibility 0s;
}

/* Aparición escalonada de los elementos al entrar */
.animar .diapositiva [data-anim] { opacity: 0; transform: translateY(26px); }
.animar .diapositiva.activa [data-anim] {
  opacity: 1; transform: none;
  transition: opacity var(--duracion-larga) var(--curva), transform var(--duracion-larga) var(--curva);
  transition-delay: calc(180ms + var(--i, 0) * var(--escalon));
}

/* Isotipo discreto en la esquina de cada diapositiva */
.esquina { position: absolute; top: 72px; right: 96px; width: 52px; color: var(--color-texto); opacity: .9; }
.fondo-claro .esquina { color: var(--color-primario); }

/* --- Piezas comunes --- */
.etiqueta {
  display: inline-flex; align-items: center; gap: 18px;
  font-size: var(--d-etiqueta); font-weight: 600; letter-spacing: var(--tracking-etiquetas);
  text-transform: uppercase; color: var(--color-marca-texto); line-height: 1.2;
}
.etiqueta::before { content: ""; width: 48px; height: 10px; border-radius: var(--radio-barra); background: var(--color-barra); flex: none; }
.cabeza { display: grid; gap: 22px; margin-bottom: 64px; max-width: 1480px; padding-right: 120px; }
.cabeza h2 { font-size: var(--d-titulo); }
.cabeza .intro { font-size: var(--d-texto-grande); color: var(--color-texto-suave); max-width: 1300px; line-height: 1.3; }
.cuerpo { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
.texto-suave { color: var(--color-texto-suave); }
.resaltado { background: var(--color-primario); color: var(--color-blanco); padding: 0 .1em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.fondo-primario .resaltado { background: var(--color-blanco); color: var(--color-primario); }
.boton {
  display: inline-flex; align-items: center; gap: 18px; padding: 26px 44px;
  font-size: 30px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; text-decoration: none;
  background: var(--color-primario); color: var(--color-blanco); border-radius: var(--radio-sm);
  transition: transform var(--duracion-corta) var(--curva), box-shadow var(--duracion-corta) var(--curva);
}
.boton svg { width: 32px; height: 32px; transition: transform var(--duracion-corta) var(--curva); }
.boton:hover { transform: translateY(-3px); box-shadow: var(--sombra); }
.boton:hover svg { transform: translateX(6px); }
.fondo-primario .boton { background: var(--color-blanco); color: var(--color-primario); }

/* Viñetas con barra roja */
.vinetas { list-style: none; padding: 0; display: grid; gap: 34px; max-width: 1500px; }
.vinetas li { display: grid; grid-template-columns: 56px 1fr; align-items: baseline; font-size: var(--d-texto-grande); line-height: 1.3; }
.vinetas li::before { content: ""; width: 34px; height: 10px; border-radius: var(--radio-barra); background: var(--color-barra); transform: translateY(-10px); }
.vinetas strong { font-weight: 600; }

/* --- 4.1 Portada --- */
.d-portada { padding-right: 0; flex-direction: row; }
.d-portada .texto { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-right: 96px; }
.d-portada .logo-grande { flex: none; width: 400px; height: auto; color: var(--color-texto); margin-bottom: 56px; }
.d-portada h1 { font-size: 140px; line-height: .92; margin: 28px 0 36px; }
.d-portada .subtitulo { font-size: var(--d-texto-grande); color: var(--color-texto-suave); max-width: 1000px; }
.d-portada .datos { display: flex; gap: 48px; margin-top: 48px; font-size: 28px; color: var(--color-texto-suave); letter-spacing: .04em; }
.d-portada .datos span + span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 48px; background: var(--color-primario); transform: translateY(-4px); }
.d-portada .panel {
  position: relative; width: 560px; margin: calc(-1 * var(--d-margen-arriba)) 0 calc(-1 * var(--d-margen-abajo));
  background: var(--color-primario); display: grid; place-items: center; overflow: hidden;
}
.d-portada .panel::before {
  content: ""; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(to bottom, rgb(255 255 255 / .09) 0 22px, transparent 22px 52px);
}
.d-portada .panel svg { position: relative; width: 300px; color: var(--color-neutro); }
.animar .d-portada.activa .panel::before { animation: deriva 30s linear infinite; }
@keyframes deriva { to { background-position: 0 52px; } }

/* --- 4.2 Separador de sección --- */
.d-seccion { justify-content: center; }
.d-seccion .fila { display: flex; align-items: center; gap: 96px; }
.d-seccion .numero { font-family: var(--fuente-titulos); font-size: 560px; line-height: .78; letter-spacing: -.01em; color: var(--color-texto); flex: none; }
.d-seccion h2 { font-size: 150px; }
.d-seccion .subtitulo { font-size: var(--d-texto-grande); color: var(--color-texto-suave); margin-top: 32px; max-width: 900px; }
.d-seccion::after {                /* patrón de barras de marca */
  content: ""; position: absolute; z-index: -1; right: 0; top: 0; bottom: 0; width: 34%;
  background-image: repeating-linear-gradient(to bottom, rgb(255 255 255 / .08) 0 22px, transparent 22px 52px);
}

/* --- 4.3 Texto --- */
.d-texto .nota { margin-top: 56px; font-size: 30px; color: var(--color-texto-suave); max-width: 1400px; }

/* --- 4.4 Dos columnas --- */
.d-dos-columnas .columnas { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 112px; align-items: center; }
.d-dos-columnas.invertir .col-visual { order: -1; }
.d-dos-columnas .col-texto .cabeza { margin-bottom: 48px; padding-right: 0; }
.d-dos-columnas .col-texto .cabeza h2 { font-size: 96px; }
.d-dos-columnas .col-texto > p { font-size: 38px; color: var(--color-texto-suave); }
.d-dos-columnas .col-texto > p + p { margin-top: 24px; }
.d-dos-columnas .col-texto .vinetas { margin-top: 40px; gap: 24px; }
.d-dos-columnas .col-texto .vinetas li { font-size: 38px; }
.col-visual { height: 100%; min-height: 0; display: grid; place-items: center; }
.d-dos-columnas .col-visual { padding-top: 32px; }          /* deja libre el isotipo de la esquina */
.foto { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: var(--radio); background: var(--color-superficie); }
.foto img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
.foto--color img { filter: none; }
.foto::after { content: ""; position: absolute; left: 0; bottom: 0; width: 38%; height: 14px; background: var(--color-primario); }

/* Ilustración de rack (mientras no haya foto) */
.ilustracion { width: 100%; max-height: 100%; }
.ilus-poste { fill: var(--color-texto-suave); }
.ilus-perfo { fill: var(--color-fondo); }
.ilus-viga { fill: var(--color-primario); }
.ilus-tarima { fill: var(--color-texto-suave); opacity: .55; }
.ilus-carga { fill: var(--color-superficie); stroke: var(--color-texto-suave); stroke-width: 1.5; }
.ilus-carga--acento { fill: var(--color-destacado); stroke: none; }
.ilus-piso { stroke: var(--color-texto-suave); stroke-width: 2; }
.ilus-cota { stroke: var(--color-info); stroke-width: 1.5; fill: none; }
.animar .diapositiva .ilus-viga { transform-box: fill-box; transform-origin: left; transform: scaleX(0); }
.animar .diapositiva .ilus-bulto { opacity: 0; }
.animar .diapositiva.activa .ilus-viga { transform: scaleX(1); transition: transform var(--duracion-larga) var(--curva) calc(300ms + var(--i, 0) * 90ms); }
.animar .diapositiva.activa .ilus-bulto { opacity: 1; transition: opacity var(--duracion-media) var(--curva) calc(700ms + var(--i, 0) * 50ms); }

/* --- 4.5 Cifras --- */
.d-cifras .cifras { flex: 1; display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 64px; align-content: center; }
.cifra { display: grid; gap: 14px; align-content: start; }
.cifra::before { content: ""; width: 96px; height: 14px; border-radius: var(--radio-barra); background: var(--color-barra); margin-bottom: 18px; }
.cifra-valor { font-family: var(--fuente-titulos); font-size: var(--d-cifra); line-height: .9; letter-spacing: .01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.d-cifras[style*="--n:4"] .cifra-valor { font-size: 150px; }
.cifra-afijo { font-size: .45em; letter-spacing: .03em; }
.cifra-etiqueta { font-weight: 600; font-size: 38px; line-height: 1.2; }
.cifra-nota { font-size: 28px; color: var(--color-texto-suave); line-height: 1.35; }

/* --- 4.6 Tarjetas --- */
.d-tarjetas .rejilla { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 36px; align-content: center; }
.tarjeta {
  position: relative; display: grid; gap: 18px; align-content: start;
  padding: 44px 44px 48px; background: var(--color-superficie); border-radius: var(--radio);
  border-bottom: 8px solid var(--color-primario);
}
.icono-caja { display: grid; place-items: center; width: 84px; height: 84px; background: var(--color-oscuro); color: var(--color-neutro); border-radius: var(--radio-sm); }
.fondo-oscuro .icono-caja { background: var(--color-primario); color: var(--color-blanco); }
.icono-caja svg { width: 44px; height: 44px; }
.tarjeta h3 { font-size: 54px; margin-top: 8px; }
.tarjeta p { font-size: 30px; color: var(--color-texto-suave); line-height: 1.35; }
/* Con 5 o 6 tarjetas: formato horizontal (ícono a la izquierda) para que quepan dos filas */
.d-tarjetas[data-cantidad="5"] .cabeza, .d-tarjetas[data-cantidad="6"] .cabeza { margin-bottom: 48px; }
.d-tarjetas[data-cantidad="5"] .tarjeta, .d-tarjetas[data-cantidad="6"] .tarjeta {
  grid-template-columns: 84px 1fr; column-gap: 28px; row-gap: 10px; padding: 32px 36px 36px;
}
.d-tarjetas[data-cantidad="5"] .icono-caja, .d-tarjetas[data-cantidad="6"] .icono-caja { grid-row: span 2; }
.d-tarjetas[data-cantidad="5"] .tarjeta h3, .d-tarjetas[data-cantidad="6"] .tarjeta h3 { font-size: 48px; margin-top: 0; align-self: center; }
.d-tarjetas[data-cantidad="5"] .tarjeta p, .d-tarjetas[data-cantidad="6"] .tarjeta p { font-size: 28px; }

/* --- 4.7 Comparativa (columnas de planes o tabla) --- */
.d-comparativa .columnas-plan { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 36px; align-items: stretch; }
.plan { position: relative; display: flex; flex-direction: column; gap: 22px; padding: 48px; background: var(--color-superficie); border-top: 10px solid var(--color-borde); border-radius: var(--radio); }
.plan--destacado { background: var(--color-oscuro); color: var(--color-neutro); --color-texto-suave: var(--color-neutro-medio); --color-marca-texto: var(--color-neutro-medio); border-top-color: var(--color-primario); }
.fondo-oscuro .plan--destacado { background: var(--color-primario); --color-texto-suave: rgb(255 255 255 / .88); --color-marca-texto: var(--color-blanco); border-top-color: var(--color-blanco); color: var(--color-blanco); }
.insignia { position: absolute; top: -10px; right: 40px; transform: translateY(-50%); padding: 10px 20px; background: var(--color-primario); color: var(--color-blanco); font-size: 22px; font-weight: 600; letter-spacing: var(--tracking-etiquetas); text-transform: uppercase; border-radius: var(--radio-sm); }
.plan h3 { font-size: 64px; }
.plan .descripcion { font-size: 30px; color: var(--color-texto-suave); line-height: 1.35; }
.plan .precio { font-family: var(--fuente-titulos); font-size: 72px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.lista-check { list-style: none; padding: 0; display: grid; gap: 16px; margin-top: 8px; }
.lista-check li { display: grid; grid-template-columns: 36px 1fr; gap: 16px; font-size: 30px; line-height: 1.3; }
.lista-check svg { width: 32px; height: 32px; margin-top: 3px; color: var(--color-marca-texto); }
.tabla { width: 100%; border-collapse: collapse; font-size: 32px; }
.tabla th, .tabla td { padding: 24px 28px; text-align: left; border-bottom: 2px solid var(--color-borde); vertical-align: top; }
.tabla thead th { font-family: var(--fuente-titulos); font-weight: 400; font-size: 48px; letter-spacing: .03em; text-transform: uppercase; border-bottom: 6px solid var(--color-texto); }
.tabla tbody th { font-weight: 600; }
.tabla .col-destacada { background: var(--color-superficie); }
.tabla thead .col-destacada { background: var(--color-primario); color: var(--color-blanco); border-bottom-color: var(--color-primario); }

/* --- 4.8 Línea de tiempo --- */
.d-linea-tiempo .linea { flex: 1; list-style: none; padding: 0; display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 40px; align-content: center; position: relative; }
.d-linea-tiempo .linea::before { content: ""; position: absolute; left: 44px; right: 44px; top: calc(50% - 150px + 43px); height: 6px; background: var(--color-borde); }
.hito { position: relative; display: grid; gap: 16px; align-content: start; min-height: 300px; }
.hito-numero {
  width: 92px; height: 92px; display: grid; place-items: center; margin-bottom: 20px;
  font-family: var(--fuente-titulos); font-size: 52px; background: var(--color-primario); color: var(--color-blanco); border-radius: var(--radio-sm);
}
.hito .fecha { font-size: 24px; font-weight: 600; letter-spacing: var(--tracking-etiquetas); text-transform: uppercase; color: var(--color-marca-texto); }
.hito h3 { font-size: 58px; }
.hito p { font-size: 30px; color: var(--color-texto-suave); line-height: 1.35; }

/* --- 4.9 Cita --- */
.d-cita { justify-content: center; }
.d-cita figure { max-width: 1480px; display: grid; gap: 56px; }
.d-cita .comillas { font-family: var(--fuente-titulos); font-size: 360px; line-height: .5; height: 150px; color: var(--color-primario); }
.d-cita blockquote { font-size: 72px; line-height: 1.22; font-weight: 500; text-wrap: balance; }
.d-cita figcaption { display: flex; gap: 28px; align-items: center; font-size: 34px; }
.d-cita figcaption::before { content: ""; width: 72px; height: 10px; border-radius: var(--radio-barra); background: var(--color-primario); }
.d-cita figcaption strong { font-weight: 600; }
.d-cita figcaption span { color: var(--color-texto-suave); }
.marca-ejemplo { position: absolute; top: 72px; left: var(--d-margen-x); padding: 8px 18px; font-size: 22px; font-weight: 600; letter-spacing: var(--tracking-etiquetas); text-transform: uppercase; color: var(--color-info); border: 2px solid currentColor; border-radius: var(--radio-sm); }

/* --- 4.10 Imagen completa --- */
.d-imagen-completa { justify-content: flex-end; }
.d-imagen-completa .fondo-foto { position: absolute; inset: 0; z-index: -2; }
.d-imagen-completa .fondo-foto img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
.d-imagen-completa .fondo-foto.color img { filter: none; }
.d-imagen-completa::before {       /* capa grafito para asegurar contraste (brand book: 60–80 %) */
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(to top, rgb(26 25 25 / .88) 0%, rgb(26 25 25 / .62) 55%, rgb(26 25 25 / .35) 100%);
}
.d-imagen-completa.sin-foto .fondo-foto {        /* respaldo mientras no haya foto: patrón de barras */
  background-color: var(--color-oscuro);
  background-image: repeating-linear-gradient(to bottom, rgb(171 5 5 / .5) 0 22px, transparent 22px 52px);
  -webkit-mask: linear-gradient(to left, #000 20%, transparent 85%);
          mask: linear-gradient(to left, #000 20%, transparent 85%);
}
.d-imagen-completa h2 { font-size: 150px; max-width: 1400px; }
.d-imagen-completa .texto { font-size: var(--d-texto-grande); color: var(--color-texto-suave); max-width: 1100px; margin-top: 36px; }
.d-imagen-completa .credito { position: absolute; right: var(--d-margen-x); bottom: 48px; font-size: 20px; color: var(--color-texto-suave); }

/* --- 4.10b Galería de proyectos --- */
.d-galeria .cabeza { margin-bottom: 44px; }
.d-galeria .galeria { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); grid-auto-rows: 1fr; gap: 20px; }
.galeria-item { position: relative; margin: 0; min-height: 0; overflow: hidden; border-radius: var(--radio); }
.galeria-item--alta { grid-row: span 2; }
.galeria-item .foto { height: 100%; border-radius: 0; }
.galeria-item .foto::after { display: none; }
.galeria-item figcaption {
  position: absolute; inset: auto 0 0 0; padding: 72px 28px 24px; display: grid; gap: 4px;
  color: var(--color-neutro); background: linear-gradient(to top, rgb(26 25 25 / .9), rgb(26 25 25 / 0));
}
.galeria-item figcaption strong {
  font-family: var(--fuente-titulos); font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: .04em;
  text-transform: uppercase; display: flex; align-items: center; gap: 14px;
}
.galeria-item figcaption strong::before { content: ""; width: 28px; height: 9px; border-radius: var(--radio-barra); background: var(--color-primario); flex: none; }
.galeria-item figcaption span { font-size: 24px; color: var(--color-neutro-medio); }

/* --- 4.11 Logos --- */
.d-logos .rejilla-logos { flex: 1; display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 32px; align-content: center; }
.logo-aliado { display: grid; place-items: center; height: 200px; padding: 32px; background: var(--color-superficie); border-radius: var(--radio); }
.logo-aliado img { max-height: 110px; width: auto; filter: grayscale(1); }
.logo-aliado span { font-family: var(--fuente-titulos); font-size: 64px; letter-spacing: .05em; text-transform: uppercase; text-align: center; line-height: 1; }

/* --- 4.12 Cierre --- */
.d-cierre { flex-direction: row; gap: 96px; align-items: stretch; }
.d-cierre .texto { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.d-cierre h2 { font-size: 150px; }
.d-cierre .mensaje { font-size: var(--d-texto-grande); color: var(--color-texto-suave); margin: 36px 0 56px; max-width: 1000px; }
.d-cierre .lado { width: 560px; display: flex; flex-direction: column; justify-content: center; gap: 48px; }
.d-cierre .logo-cierre { flex: none; width: 380px; height: auto; color: var(--color-texto); }
.contacto { list-style: none; padding: 0; display: grid; gap: 26px; font-style: normal; }
.contacto li { display: grid; grid-template-columns: 64px 1fr; gap: 24px; align-items: center; font-size: 32px; font-weight: 500; }
.contacto .icono-caja { width: 64px; height: 64px; background: rgb(0 0 0 / .2); color: var(--color-texto); }
.contacto .icono-caja svg { width: 32px; height: 32px; }
.contacto a { color: inherit; text-decoration: none; }
.qr { width: 220px; padding: 16px; background: var(--color-blanco); border-radius: var(--radio-sm); }
.qr figcaption { font-size: 20px; color: var(--color-secundario); text-align: center; margin-top: 8px; }

/* ==========================================================================
   5. INTERFAZ (progreso, contador, cuadrícula, notas) — no se imprime
   ========================================================================== */
.interfaz { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.progreso {
  position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
  -webkit-mask: repeating-linear-gradient(to right, #000 0 44px, transparent 44px 52px);
          mask: repeating-linear-gradient(to right, #000 0 44px, transparent 44px 52px);
  background: rgb(128 128 128 / .25);
}
.progreso span { position: absolute; inset: 0; background: var(--color-primario); transform-origin: left; transform: scaleX(var(--avance, 0)); transition: transform var(--duracion-media) var(--curva); }
.lienzo[data-fondo="primario"] .progreso span { background: var(--color-blanco); }
.contador {
  position: absolute; right: 96px; bottom: 40px;
  font-family: var(--fuente-titulos); font-size: 34px; letter-spacing: .08em; color: var(--color-texto-suave);
}
.lienzo[data-fondo="oscuro"] .contador { color: var(--color-neutro-medio); }
.lienzo[data-fondo="primario"] .contador { color: rgb(255 255 255 / .88); }
.contador b { font-weight: 400; color: var(--color-texto); }
.lienzo[data-fondo="oscuro"] .contador b, .lienzo[data-fondo="primario"] .contador b { color: var(--color-blanco); }

/* Pista de atajos (aparece al inicio y se desvanece) */
.pista-atajos {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20;
  padding: 10px 16px; border-radius: var(--radio); background: rgb(17 16 16 / .88); color: var(--color-neutro);
  font-size: 14px; letter-spacing: .02em; white-space: nowrap; pointer-events: none;
  transition: opacity 600ms var(--curva);
}
.pista-atajos.oculta { opacity: 0; }
.pista-atajos kbd { font-family: inherit; font-weight: 600; padding: 1px 6px; border: 1px solid rgb(255 255 255 / .3); border-radius: 3px; }
@media (max-width: 700px) { .pista-atajos { white-space: normal; width: calc(100% - 32px); text-align: center; } }

/* Vista de cuadrícula */
.cuadricula {
  position: fixed; inset: 0; z-index: 30; overflow: auto;
  background: rgb(17 16 16 / .96); color: var(--color-neutro);
  padding: 72px 20px 40px;
}
.cuadricula[hidden] { display: none; }
.cuadricula > .titulo-cuadricula { position: fixed; top: 0; left: 0; right: 0; padding: 20px 24px; font-size: 32px; background: rgb(17 16 16 / .96); z-index: 1; }
.cuadricula > .titulo-cuadricula small { font-family: var(--fuente-cuerpo); font-size: 14px; letter-spacing: .04em; text-transform: none; color: var(--color-neutro-medio); margin-left: 16px; }
.miniaturas { list-style: none; padding: 0; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, 320px); gap: 24px; justify-content: center; }
.miniatura-boton {
  position: relative; display: block; width: 320px; height: 180px; padding: 0; overflow: hidden;
  background: none; border: 3px solid transparent; border-radius: var(--radio); cursor: pointer;
  transition: border-color var(--duracion-corta) var(--curva), transform var(--duracion-corta) var(--curva);
}
.miniatura-boton:hover { transform: translateY(-3px); border-color: var(--color-neutro-medio); }
.miniatura-boton[aria-current="true"] { border-color: var(--color-primario); }
.miniatura-boton .num { position: absolute; left: 8px; bottom: 8px; z-index: 2; padding: 2px 10px; background: rgb(17 16 16 / .85); color: var(--color-neutro); font-family: var(--fuente-titulos); font-size: 20px; letter-spacing: .06em; border-radius: var(--radio-sm); }
.miniatura { text-align: left; font-size: 16px; line-height: normal; letter-spacing: normal; text-transform: none; position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform: scale(calc(314 / 1920)); transform-origin: 0 0; pointer-events: none; }
.miniatura .diapositiva { opacity: 1 !important; visibility: visible !important; transform: none !important; transition: none !important; }
.miniatura [data-anim], .miniatura .ilus-viga, .miniatura .ilus-bulto { opacity: 1 !important; transform: none !important; transition: none !important; }

/* Notas del presentador */
.notas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; max-height: 34vh; overflow: auto;
  padding: 18px 24px 22px; background: rgb(17 16 16 / .95); color: var(--color-neutro);
  border-top: 4px solid var(--color-primario); font-size: 18px; line-height: 1.5;
}
.notas[hidden] { display: none; }
.notas strong { display: block; font-family: var(--fuente-titulos); font-weight: 400; font-size: 24px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; color: var(--color-neutro-medio); }
.notas p + p { margin-top: 8px; }

/* ==========================================================================
   6. MOVIMIENTO REDUCIDO — nada se mueve y todo se ve
   ========================================================================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  .diapositiva, .diapositiva.previa { transform: none; }
  [data-anim], .ilus-viga, .ilus-bulto { opacity: 1 !important; transform: none !important; }
}

/* ==========================================================================
   7. IMPRESIÓN Y PDF — una diapositiva por página, 16:9 exacto
   Chrome: Imprimir → Guardar como PDF · Márgenes: Ninguno · Gráficos de fondo: activado
   ========================================================================== */
@page { size: 1920px 1080px; margin: 0; }
@media print {
  html, body { height: auto; overflow: visible; background: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .escenario { position: static; overflow: visible; }
  .lienzo { position: static; transform: none !important; width: 1920px; height: auto; overflow: visible; background: none; }
  .diapositiva {
    position: relative; width: 1920px; height: 1080px;
    opacity: 1 !important; visibility: visible !important; transform: none !important;
    break-after: page; page-break-after: always; break-inside: avoid;
  }
  .diapositiva:last-child { break-after: auto; page-break-after: auto; }
  [data-anim], .ilus-viga, .ilus-bulto { opacity: 1 !important; transform: none !important; }
  .interfaz, .cuadricula, .notas, .pista-atajos, #anuncio { display: none !important; }
}
</style>

  /* ---------- Utilidades ---------- */
  function h(etiqueta, props, ...hijos) {

      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style') el.style.cssText = v;

  function icono(nombre) {

  // Foto con versión chica opcional ("chica": 640 px). sizes = qué fracción de la pantalla ocupa;

  function ilustracionRack() {

    let svg = '<svg class="ilustracion" viewBox="0 0 520 440" aria-hidden="true" focusable="false">';
    svg += '<line class="ilus-piso" x1="0" y1="412" x2="520" y2="412"/><path class="ilus-cota" d="M508 20v392M502 20h12M502 412h12"/>';
    postes.forEach((x) => {
      svg += '<rect class="ilus-poste" x="' + x + '" y="20" width="16" height="392" rx="2"/>';
      for (let y = 30; y < 404; y += 18) svg += '<rect class="ilus-perfo" x="' + (x + 6) + '" y="' + y + '" width="4" height="9" rx="2"/>';

    bahias.forEach(([x1, x2], b) => {

        cargas[b * 3 + n].forEach((c) => {

  const marca = datos.marca || {};

        const cls = (i) => (i === destacada ? 'col-destacada' : null);
        return { fondo: 'claro', nodos: [cabeza(d), h('div', { class: 'cuerpo' }, anim(h('table', { class: 'tabla' },
          lista(d.tabla.encabezados).length ? h('thead', {}, h('tr', {}, lista(d.tabla.encabezados).map((e, i) => h('th', { scope: 'col', class: cls(i), text: e })))) : null,
          h('tbody', {}, lista(d.tabla.filas).map((fila) => h('tr', {}, lista(fila).map((c, i) => h(i === 0 ? 'th' : 'td', { scope: i === 0 ? 'row' : null, class: cls(i), text: c }))))))))] };
      }
      const cols = lista(d.columnas).slice(0, 4);
      if (!cols.length) return null;
      return { fondo: 'claro', estilo: '--n:' + cols.length, nodos: [cabeza(d), h('div', { class: 'columnas-plan' }, cols.map((c) => anim(h('article', { class: 'plan' + (c.destacado ? ' plan--destacado' : '') },
        c.destacado && tiene(c.insignia) ? h('span', { class: 'insignia', text: c.insignia }) : null,
        tiene(c.nombre) ? h('h3', { text: c.nombre }) : null,
        tiene(c.descripcion) ? h('p', { class: 'descripcion', text: c.descripcion }) : null,
        tiene(c.precio) ? h('p', { class: 'precio', text: c.precio }) : null,
        lista(c.puntos).length ? h('ul', { class: 'lista-check' }, lista(c.puntos).map((p) => h('li', {}, icono('check'), h('span', { text: p })))) : null))))] };
    },
    'linea-tiempo'(d) {
      const items = lista(d.items).slice(0, 6);
      if (!items.length) return null;
      return { fondo: 'claro', nodos: [cabeza(d), h('ol', { class: 'linea', style: '--n:' + items.length }, items.map((p, i) => anim(h('li', { class: 'hito' },
        h('span', { class: 'hito-numero', 'aria-hidden': 'true', text: String(i + 1).padStart(2, '0') }),
        tiene(p.fecha) ? h('p', { class: 'fecha', text: p.fecha }) : null,
        tiene(p.titulo) ? h('h3', { text: p.titulo }) : null,
        parrafos(p.texto)))))] };
    },
    cita(d) {
      if (!tiene(d.cita)) return null;
      return { fondo: 'oscuro', nodos: [
        d.ejemplo ? h('span', { class: 'marca-ejemplo', text: 'Ejemplo · reemplazar' }) : null,
        h('figure', {},
          anim(h('span', { class: 'comillas', 'aria-hidden': 'true', text: '“' })),
          anim(h('blockquote', {}, h('p', { text: d.cita }))),
          (tiene(d.nombre) || tiene(d.cargo)) ? anim(h('figcaption', {}, h('span', {}, tiene(d.nombre) ? h('strong', { text: d.nombre }) : null, tiene(d.cargo) ? [' · ', d.cargo] : null))) : null)] };
    },
    'imagen-completa'(d) {
      const conFoto = d.imagen && tiene(d.imagen.src);
      if (conFoto && !tiene(d.imagen.alt)) console.warn('Imagen sin "alt":', d.imagen.src);
      return { fondo: 'oscuro', clase: conFoto ? '' : 'sin-foto', nodos: [
        h('div', { class: 'fondo-foto' + (conFoto && d.imagen.color ? ' color' : '') }, conFoto ? h('img', { src: d.imagen.src, alt: d.imagen.alt || '' }) : null),
        tiene(d.titulo) ? anim(h('h2', {}, tituloConResaltado(d.titulo, d.resaltado))) : null,
        tiene(d.texto) ? anim(h('p', { class: 'texto', text: d.texto })) : null,
        tiene(d.credito) ? h('p', { class: 'credito', text: d.credito }) : null] };
    },
    // Galería de 1 a 6 fotos. Con 5, la primera ocupa dos filas para que la rejilla cierre;
    // con 4 va en 2 × 2; con 6, en 3 × 2.
    galeria(d) {
      const items = lista(d.items).filter((g) => g.imagen && tiene(g.imagen.src)).slice(0, 6);
      if (!items.length) return null;
      const n = items.length, cols = n === 4 ? 2 : Math.min(n, 3);
      return { fondo: d.fondo || 'claro', estilo: '--cols:' + cols, datos: { cantidad: n }, nodos: [cabeza(d),
        h('div', { class: 'galeria' }, items.map((g, i) => anim(h('figure', { class: 'galeria-item' + (n === 5 && i === 0 ? ' galeria-item--alta' : '') },
          imagen(g.imagen, n <= 2 ? '50vw' : '33vw'),
          (tiene(g.titulo) || tiene(g.texto)) ? h('figcaption', {},
            tiene(g.titulo) ? h('strong', { text: g.titulo }) : null,
            tiene(g.texto) ? h('span', { text: g.texto }) : null) : null))))] };
    },
    logos(d) {
      const items = lista(d.items).filter((a) => tiene(a.nombre) || tiene(a.logo));
      if (!items.length) return null;
      const cols = items.length <= 4 ? items.length : items.length <= 6 ? 3 : 4;
      return { fondo: 'claro', estilo: '--cols:' + cols, nodos: [cabeza(d), h('ul', { class: 'rejilla-logos', style: 'list-style:none;padding:0' }, items.map((a) => anim(h('li', { class: 'logo-aliado' },
        tiene(a.logo) ? h('img', { src: a.logo, alt: a.nombre || '' }) : h('span', { text: a.nombre })))))] };
    },
    cierre(d) {
      const contactos = lista(d.contacto).filter((c) => tiene(c.valor));
      const cta = d.cta && tiene(d.cta.texto) ? anim(h('a', { class: 'boton', href: enlaceSeguro(d.cta.enlace), target: /^https?:/i.test(d.cta.enlace || '') ? '_blank' : null, rel: 'noopener' }, d.cta.texto, icono('flecha'))) : null;
      const qr = d.qr && tiene(d.qr.src) ? anim(h('figure', { class: 'qr' }, h('img', { src: d.qr.src, alt: d.qr.alt || 'Código QR' }), tiene(d.qr.texto) ? h('figcaption', { text: d.qr.texto }) : null)) : null;
      return { fondo: 'primario', esquina: false, nodos: [
        h('div', { class: 'texto' },
          tiene(d.titulo) ? anim(h('h2', {}, tituloConResaltado(d.titulo, d.resaltado))) : null,
          tiene(d.texto) ? anim(h('p', { class: 'mensaje', text: d.texto })) : null,
          cta ? h('div', {}, cta) : null),
        h('div', { class: 'lado' },
          anim(decorativo(logo('tpl-logo', 'logo-cierre'))),
          contactos.length ? h('address', {}, h('ul', { class: 'contacto' }, contactos.map((c) => anim(h('li', {},
            h('span', { class: 'icono-caja' }, icono(c.tipo || 'sitio')),
            tiene(c.enlace) ? h('a', { href: enlaceSeguro(c.enlace), text: c.valor }) : h('span', { text: c.valor })))))) : null,
          qr)] };
    }
  };

  /* ---------- Armado ---------- */
  // El título de la página vive en el <head> (tarjeta para compartir).
  const fuente = lista(datos.diapositivas);
  const diapos = [];
  fuente.forEach((d) => {
    if (!d || !T[d.tipo]) { if (d && d.tipo) console.warn('Tipo de diapositiva desconocido:', d.tipo); return; }
    indiceAnim = 0;
    const r = T[d.tipo](d);
    if (!r) return;
    const fondo = ['claro', 'oscuro', 'primario'].includes(d.fondo) ? d.fondo : r.fondo;
    const el = h('section', { class: ['diapositiva', 'd-' + d.tipo, 'fondo-' + fondo, r.clase].filter(Boolean).join(' '), style: r.estilo || null, 'aria-roledescription': 'diapositiva' },
      r.nodos, r.esquina === false ? null : decorativo(logo('tpl-isotipo', 'esquina')));
    if (r.datos) Object.entries(r.datos).forEach(([k, v]) => el.setAttribute('data-' + k, v));
    el.dataset.fondo = fondo;
    diapos.push({ el, d, titulo: d.titulo || d.cita || d.tipo });
    contenedor.append(el);
  });
  const total = diapos.length;
  document.getElementById('total').textContent = total;
  diapos.forEach((x, i) => x.el.setAttribute('aria-label', (i + 1) + ' de ' + total + (tiene(x.titulo) ? ': ' + x.titulo : '')));

  /* ---------- Escala del lienzo ---------- */
  function escalar() {
    const k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    lienzo.style.setProperty('--escala', k);
  }
  window.addEventListener('resize', escalar);
  escalar();

  /* ---------- Navegación ---------- */
  let actual = -1;
  const anuncio = document.getElementById('anuncio');
  const notas = document.getElementById('notas');

  function contar(el) {
    const fin = parseFloat(el.dataset.valor), dec = +el.dataset.decimales || 0;
    const fmt = new Intl.NumberFormat('es-MX', { minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: el.dataset.agrupar !== 'false' });
    if (sinMovimiento) { el.textContent = fmt.format(fin); return; }
    const t0 = performance.now() + 250, dur = 700;
    el.textContent = fmt.format(0);
    const paso = (t) => {
      const k = Math.max(0, Math.min(1, (t - t0) / dur)), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt.format(k < 1 ? fin * e : fin);
      if (k < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  }

  function pintarNotas() {
    const x = diapos[actual];
    const texto = x && lista(x.d.notas);
    notas.replaceChildren(h('strong', { text: 'Notas · ' + (actual + 1) + ' / ' + total }),
      ...(texto && texto.length ? texto.map((t) => h('p', { text: t })) : [h('p', { text: 'Sin notas para esta diapositiva.' })]));
  }

  function ir(i, desdeHash) {
    if (!total) return;
    i = Math.max(0, Math.min(total - 1, i));
    if (i === actual) return;
    actual = i;
    diapos.forEach((x, j) => {
      x.el.classList.toggle('activa', j === i);
      x.el.classList.toggle('previa', j < i);
      x.el.toggleAttribute('inert', j !== i);
      x.el.setAttribute('aria-hidden', j === i ? 'false' : 'true');
    });
    const x = diapos[i];
    lienzo.dataset.fondo = x.el.dataset.fondo;
    lienzo.style.setProperty('--avance', total > 1 ? i / (total - 1) : 1);
    document.getElementById('actual').textContent = i + 1;
    anuncio.textContent = 'Diapositiva ' + (i + 1) + ' de ' + total + (tiene(x.titulo) ? ': ' + x.titulo : '');
    x.el.querySelectorAll('.cuenta').forEach(contar);
    if (!desdeHash) history.replaceState(null, '', '#' + (i + 1));
    if (!notas.hidden) pintarNotas();
  }
  const siguiente = () => ir(actual + 1);
  const anterior = () => ir(actual - 1);

  function desdeHash() {
    const n = parseInt((location.hash || '').replace('#', ''), 10);
    return Number.isFinite(n) ? n - 1 : 0;
  }
  window.addEventListener('hashchange', () => ir(desdeHash(), true));

  /* Cuadrícula de miniaturas */
  const cuadricula = document.getElementById('cuadricula');
  const miniaturas = document.getElementById('miniaturas');
  let focoPrevio = null;
  function abrirCuadricula() {
    miniaturas.replaceChildren(...diapos.map((x, i) => {
      const clon = x.el.cloneNode(true);
      clon.classList.remove('activa', 'previa');
      clon.removeAttribute('inert'); clon.removeAttribute('aria-label'); clon.removeAttribute('aria-roledescription');
      clon.querySelectorAll('[id]').forEach((n) => n.removeAttribute('id'));
      clon.querySelectorAll('.cuenta').forEach((n) => {
        const dec = +n.dataset.decimales || 0;
        n.textContent = new Intl.NumberFormat('es-MX', { minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: n.dataset.agrupar !== 'false' }).format(parseFloat(n.dataset.valor));
      });
      const marco = h('div', { class: 'miniatura', 'aria-hidden': 'true' }, clon);
      const b = h('button', { type: 'button', class: 'miniatura-boton', 'aria-label': 'Ir a la diapositiva ' + (i + 1) + (tiene(x.titulo) ? ': ' + x.titulo : ''), 'aria-current': i === actual ? 'true' : null },
        marco, h('span', { class: 'num', text: String(i + 1) }));
      b.addEventListener('click', () => { cerrarCuadricula(); ir(i); });
      return h('li', {}, b);
    }));
    focoPrevio = document.activeElement;
    cuadricula.hidden = false;
    const actualBtn = miniaturas.querySelector('[aria-current="true"]') || miniaturas.querySelector('button');
    actualBtn && actualBtn.focus();
    actualBtn && actualBtn.scrollIntoView({ block: 'center' });
  }
  function cerrarCuadricula() {
    cuadricula.hidden = true;
    miniaturas.replaceChildren();
    if (focoPrevio && focoPrevio.focus) focoPrevio.focus();
  }
  const cuadriculaAbierta = () => !cuadricula.hidden;

  function alternarPantallaCompleta() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.();
  }
  function alternarTema() {
    const nuevo = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nuevo);
    try { localStorage.setItem('rt-tema', nuevo); } catch (e) {}
  }
  function alternarNotas() {
    notas.hidden = !notas.hidden;
    if (!notas.hidden) pintarNotas();
  }

  /* Teclado */
  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key;
    if (cuadriculaAbierta()) {
      if (k === 'Escape' || k === 'g' || k === 'G') { e.preventDefault(); cerrarCuadricula(); }
      else if (['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'].includes(k)) {
        const botones = [...miniaturas.querySelectorAll('button')];
        const i = botones.indexOf(document.activeElement);
        const porFila = Math.max(1, Math.round(miniaturas.clientWidth / 344));
        const salto = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: porFila, ArrowUp: -porFila }[k];
        const destino = botones[Math.max(0, Math.min(botones.length - 1, (i < 0 ? 0 : i) + salto))];
        if (destino) { e.preventDefault(); destino.focus(); destino.scrollIntoView({ block: 'nearest' }); }
      }
      return;
    }
    switch (k) {
      case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ': case 'Spacebar':
        e.preventDefault(); siguiente(); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp':
        e.preventDefault(); anterior(); break;
      case 'Home': e.preventDefault(); ir(0); break;
      case 'End': e.preventDefault(); ir(total - 1); break;
      case 'f': case 'F': alternarPantallaCompleta(); break;
      case 'g': case 'G': case 'Escape': if (!document.fullscreenElement || k !== 'Escape') { e.preventDefault(); abrirCuadricula(); } break;
      case 'n': case 'N': alternarNotas(); break;
      case 't': case 'T': alternarTema(); break;
    }
  });

  /* Clic en los bordes y deslizamiento táctil */
  const escenario = document.getElementById('escenario');
  let inicio = null, deslizo = false;
  escenario.addEventListener('pointerdown', (e) => { inicio = { x: e.clientX, y: e.clientY }; deslizo = false; });
  escenario.addEventListener('pointerup', (e) => {
    if (!inicio) return;
    const dx = e.clientX - inicio.x, dy = e.clientY - inicio.y;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { deslizo = true; dx < 0 ? siguiente() : anterior(); }
    inicio = null;
  });
  escenario.addEventListener('click', (e) => {
    if (deslizo || e.target.closest('a, button')) return;
    const x = e.clientX / window.innerWidth;
    if (x > 0.85) siguiente();
    else if (x < 0.15) anterior();
  });

  /* Pista de atajos: se desvanece a los 5 s */
  const pista = document.getElementById('pista');
  setTimeout(() => pista.classList.add('oculta'), 5000);

  /* Tema del sistema si la persona no eligió uno */
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
    let guardado = null;
    try { guardado = localStorage.getItem('rt-tema'); } catch (err) {}
    if (!guardado) document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
  });

  /* Impresión: cifras finales, modo claro */
  let temaAntes = null;
  window.addEventListener('beforeprint', () => {
    document.querySelectorAll('#diapositivas .cuenta').forEach((n) => {
      const dec = +n.dataset.decimales || 0;
      n.textContent = new Intl.NumberFormat('es-MX', { minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: n.dataset.agrupar !== 'false' }).format(parseFloat(n.dataset.valor));
    });
    temaAntes = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', 'light');
  });
  window.addEventListener('afterprint', () => { if (temaAntes) document.documentElement.setAttribute('data-theme', temaAntes); });

  ir(desdeHash(), true);
  if (!location.hash) history.replaceState(null, '', '#' + (actual + 1));
})();
</script>
</body>
</html>
